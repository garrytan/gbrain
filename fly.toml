app = "gbrain-chris"
primary_region = "sjc"

[env]
  # The vault lives on the laptop; this host must never run or dispatch sync
  # (2026-08-10 near-miss: auto-recovery git-init of a bare vault path).
  GBRAIN_SYNC_DISABLED = "1"
  # Big sonnet turns (dream patterns, subagents) run past the provider's 5-min
  # default; the laptop learned 40 min the hard way (2026-08-03 incident).
  GBRAIN_CLAUDE_CLI_TIMEOUT_MS = "2400000"
  OLLAMA_KEEP_ALIVE = "-1"
  GBRAIN_EMBEDDING_MODEL = "ollama:nomic-embed-text"
  GBRAIN_EMBEDDING_DIMENSIONS = "768"
  OLLAMA_BASE_URL = "http://127.0.0.1:11434/v1"
  GBRAIN_PUBLIC_URL = "https://gbrain-chris.fly.dev"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
