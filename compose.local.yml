# Postgres for running a real brain on this machine, under podman.
#
# Separate from docker-compose.test.yml / docker-compose.ci.yml on purpose:
# those listen on 5434-5437 and the test suite wipes them with TRUNCATE
# CASCADE. This one holds your actual data, so it gets its own port and its
# own named volume.
#
# pg17 because src/core/migrate.ts refuses anything below Postgres 15, and
# PGLite is on 17.5 — matching majors keeps both engines parsing the same SQL
# (test/e2e/engine-parity.test.ts). The pg17 image also ships pgvector 0.8, so
# halfvec columns work instead of falling back to vector.
#
#   podman machine start
#   podman compose -f compose.local.yml up -d
#   export DATABASE_URL="postgresql://gbrain:gbrain@localhost:5432/gbrain"
#
# `podman compose` hands this file to whatever compose binary it can find. If
# you don't have one, the same thing without any compose tool:
#
#   podman volume create gbrain-local-pgdata
#   podman run -d --name gbrain-postgres \
#     -e POSTGRES_USER=gbrain -e POSTGRES_PASSWORD=gbrain -e POSTGRES_DB=gbrain \
#     -p 5432:5432 -v gbrain-local-pgdata:/var/lib/postgresql/data \
#     docker.io/pgvector/pgvector:pg17
services:
  postgres:
    # Fully qualified: podman has no implicit Docker Hub prefix.
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain
      POSTGRES_DB: gbrain
    ports: ["5432:5432"]
    volumes: ["gbrain-local-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  gbrain-local-pgdata:
