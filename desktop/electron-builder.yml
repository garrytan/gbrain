appId: com.pmbrain.desktop
productName: PMBrain
artifactName: PMBrain-Windows-${arch}-Setup-${version}.${ext}
compression: store
electronDist: node_modules/electron/dist
electronVersion: 36.5.0
directories:
  output: dist
files:
  # Only production Electron output belongs in app.asar. Preview files created
  # by preview-renderer.ts live beside these directories and may contain local
  # example paths, so never package the whole out/ directory.
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
extraResources:
  - from: build/extraResources/pmbrain-runtime
    to: pmbrain-runtime
  # Broad file sets omit nested node_modules, so PGLite must be copied explicitly.
  - from: ../node_modules/@electric-sql/pglite
    to: pmbrain-runtime/node_modules/@electric-sql/pglite
  - from: ../node_modules/@napi-rs/canvas
    to: pmbrain-runtime/node_modules/@napi-rs/canvas
  - from: ../node_modules/@napi-rs/canvas-win32-x64-msvc
    to: pmbrain-runtime/node_modules/@napi-rs/canvas-win32-x64-msvc
  - from: ../node_modules/@dqbd/tiktoken
    to: pmbrain-runtime/node_modules/@dqbd/tiktoken
  - from: ../node_modules/@aws-sdk
    to: pmbrain-runtime/node_modules/@aws-sdk
  - from: ../node_modules/@smithy
    to: pmbrain-runtime/node_modules/@smithy
  - from: ../node_modules/libheif-js
    to: pmbrain-runtime/node_modules/libheif-js
  - from: ../node_modules/tslib
    to: pmbrain-runtime/node_modules/tslib
  - from: ../node_modules/web-tree-sitter
    to: pmbrain-runtime/node_modules/web-tree-sitter
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: PMBrain
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: generic
  url: https://ghproxy.net/https://github.com/zhengyunhui123-dev/PMBrain/releases/latest/download
