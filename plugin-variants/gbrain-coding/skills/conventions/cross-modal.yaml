# Cross-Modal Review Configuration
# Which skills review which outputs, and how a refusal is reported.

review_pairs:
  # After brain writes, optionally verify quality
  - trigger_skill: idea-ingest
    review_skill: cross-modal-review
    when: "page has >500 words or mentions >3 entities"

  - trigger_skill: media-ingest
    review_skill: cross-modal-review
    when: "transcript enrichment produces >5 entity updates"

  - trigger_skill: meeting-ingestion
    review_skill: cross-modal-review
    when: "meeting has >5 attendees"

  - trigger_skill: enrich
    review_skill: cross-modal-review
    when: "Tier 1 enrichment (full pipeline)"

refusal_routing:
  # A refusal is a result: report it to the user as a provider refusal
  # (not a model failure), naming the model. "report" is the only value; the
  # removed next_in_chain is read as report, with a one-line notice.
  behavior: "report"
  rule: "Always show the refusal to the user, naming the model. Another model reviews only when the user chooses one; the output then names the switch. Never reword the request to get around a refusal."

spawn_rules:
  threshold: 3  # 3+ items = spawn sub-agent
  model: "cheap" # use the cheapest model that handles the task
  timeout_seconds: 120
