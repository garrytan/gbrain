name: Apple helper

# Builds and tests the macOS helper under apple/helper/ (Swift), then runs the
# headless signing probe (apple/helper/scripts/signing-probe.sh), whose answer
# lands in the job summary. Not a required check, and kept out of test.yml so
# full-suite reuse is unchanged for every other change. Uses no secrets.

on:
  pull_request:
    branches: [master]
    # Event parity (docs/ci-event-parity.md): path-gated named exception; covered by the master push run on the same paths.
    paths:
      - 'apple/**'
      - '.github/workflows/apple-helper.yml'
  push:
    branches: [master]
    paths:
      - 'apple/**'
      - '.github/workflows/apple-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Apple helper (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apple/helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
      - name: Bundle property lists parse
        run: plutil -lint Bundle/Info.plist Bundle/io.gbrain.apple-helper.plist Bundle/gbrain-apple-helper.entitlements
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Signing probe
        timeout-minutes: 15
        working-directory: .
        run: bash apple/helper/scripts/signing-probe.sh
