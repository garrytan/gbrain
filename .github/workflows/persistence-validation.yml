name: Durable persistence validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-performance:
    name: Read latency / ${{ matrix.engine }} / Bun ${{ matrix.bun }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [pglite, postgres]
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require valid workloads; report the p99 ratio as advisory
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
        run: >-
          bun --no-env-file scripts/persistence/performance.ts --engine=${{ matrix.engine }}
          --informational --manifest=.context/persistence-read-latency.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-read-${{ matrix.engine }}-bun-${{ matrix.bun }}
          path: .context/persistence-read-latency.json
          if-no-files-found: error

  deployment-matrix:
    name: PgBouncer, RLS and pool capacity / Bun ${{ matrix.bun }}
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: gbrain_test
          DB_PASSWORD: gbrain_test
          POOL_MODE: transaction
          AUTH_TYPE: plain
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '10'
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout,search_path
        ports: ['55433:5432']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Execute all 24 deployment cases and owner transfer fencing
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_PGBOUNCER_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:55433/gbrain_test
        run: bun --no-env-file scripts/persistence/matrix.ts
      - name: Require PostgreSQL lifecycle, projection and recovery contracts
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
        run: |
          : "${DATABASE_URL:?PostgreSQL contract tests require the explicit test database}"
          bun --no-env-file test --timeout=120000 \
            test/persistence-admission-observer.test.ts \
            test/persistence-read-diagnostics.test.ts \
            test/persistence-journal.test.ts \
            test/persistence-publication-refusal-5974.test.ts \
            test/persistence-staging.test.ts \
            test/persistence-effect-recovery-fairness.test.ts \
            test/import-publication-guards.test.ts \
            test/persistence-withdrawal-retry.test.ts \
            test/persistence-tombstone-noop.test.ts \
            test/persistence-version-deletion.test.ts \
            test/version-history-privacy.test.ts \
            test/persistence-take-receipt-authority.test.ts \
            test/import-revision-revival.test.ts \
            test/persistence-source-lifecycle.test.ts \
            test/persistence-physical-root.test.ts \
            test/persistence-topology-capacity.test.ts \
            test/persistence-topology-quotas.test.ts \
            test/persistence-contextual-embedding.test.ts \
            test/page-projection-concurrency.test.ts \
            test/persistence-migration-preservation.test.ts \
            test/persistence-recovery-capacity.test.ts \
            test/audit/pool-recovery-audit.test.ts \
            test/persistence-recovery-fairness.test.ts
      - name: Require data-safety on PostgreSQL
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          GBRAIN_CI_DISABLE_TEST_ENV_FILE: '1'
        run: |
          : "${DATABASE_URL:?Data-safety tests require the explicit test database}"
          bun --no-env-file test --timeout=180000 test/persistence-publication-native.serial.test.ts
          bun --no-env-file test --timeout=180000 test/persistence-sync-origin-native.test.ts
          bun --no-env-file test --timeout=180000 test/persistence-sync-options.serial.test.ts
          bun --no-env-file test --timeout=180000 test/persistence-sync-company.serial.test.ts
      - name: Require canonical reconciliation through direct and pooled PostgreSQL
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          GBRAIN_PGBOUNCER_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:55433/gbrain_test
          GBRAIN_PGBOUNCER_DIRECT_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_CI_REQUIRE_PGBOUNCER: '1'
        run: >-
          bun --no-env-file test --timeout=120000
          test/persistence-reconcile.test.ts
          test/persistence-reconcile-additive-5974.test.ts
          test/e2e/reconcile-pgbouncer.test.ts
          test/e2e/extract-atoms-page-state.test.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-deployment-bun-${{ matrix.bun }}
          path: .context/persistence-runtime-matrix.json
          if-no-files-found: error

  # Unit-lane suites whose PostgreSQL arm is gated on DATABASE_URL: the unit,
  # serial and slow lanes unset it, so these arms run only here (both arms per
  # file; the PGLite arm also runs in the unit lane). scripts/check-postgres-lane-coverage.ts
  # fails a new DATABASE_URL-gated arm until it is listed here or wrapped in a
  # test/e2e registerPostgresTests file. The two shards are balanced by measured runtime.
  unit-postgres-arms:
    name: Unit-lane PostgreSQL arms ${{ matrix.shard }}/2 / Bun ${{ matrix.bun }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require PostgreSQL arms of unit-lane suites
        timeout-minutes: 20
        shell: bash
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          SHARD: ${{ matrix.shard }}
        run: |
          : "${DATABASE_URL:?unit-lane PostgreSQL arms require the explicit test database}"
          case "$SHARD" in
            1) files=(
                test/attribution-backfill-history.test.ts
                test/behavior-change-notice.test.ts
                test/colon-slug-windows-5032.test.ts
                test/decide/conflict-proposals-managed.test.ts
                test/declared-lineage-visibility.test.ts
                test/extract-endpoint-revision.serial.test.ts
                test/graduation-digest.test.ts
                test/graduation-drain.test.ts
                test/graduation-inventory.test.ts
                test/graduation-state.test.ts
                test/grandfather-managed.test.ts
                test/harness-skills-epoch.test.ts
                test/links-attendance-blocked.test.ts
                test/managed-cycle-pull-upstream.test.ts
                test/managed-lint.test.ts
                test/managed-maintenance-links.test.ts
                test/managed-sync-drain.test.ts
                test/pack-relation-direction-engine.test.ts
                test/page-embedding-install-batch.test.ts
                test/page-state-engine.test.ts
                test/persistence-commit-durability.test.ts
                test/persistence-deactivate.test.ts
                test/persistence-file-import.test.ts
                test/persistence-graph-publication.test.ts
                test/persistence-managed-lifecycle.test.ts
                test/persistence-managed-sync.test.ts
                test/persistence-memory-mutations.test.ts
                test/persistence-page-authority.test.ts
                test/persistence-skill-bundles.serial.test.ts
                test/shared-content-freshness.test.ts
                test/shared-skills-writer-boundary.test.ts
                test/source-retire-missing-checkout.test.ts
                test/sync-legacy-holds.test.ts
                test/takes-vector-lifecycle-5885.serial.test.ts
                test/withdrawal-overlay-concurrency.test.ts
              ) ;;
            2) files=(
                test/alias-source-cascade-5094.test.ts
                test/company-brain-policy.test.ts
                test/company-brain-runtime.test.ts
                test/engine-sql-facts-keyset.test.ts
                test/derived-link-reconciliation.test.ts
                test/doctor-frontmatter-holds.test.ts
                test/embedding-completion-atomic.serial.test.ts
                test/graduation-copy.test.ts
                test/graduation-discard.test.ts
                test/graduation-rollback.test.ts
                test/graduation-target.test.ts
                test/graduation-verify.test.ts
                test/held-read-signals.test.ts
                test/import-frontmatter-key-order-5158.test.ts
                test/import-revision-concurrency.test.ts
                test/managed-sweep-corpus-windows.test.ts
                test/managed-sync-bulk.test.ts
                test/managed-sync-chunker-version.test.ts
                test/managed-sync-group-completion.test.ts
                test/persistence-diagnostics.test.ts
                test/persistence-git-subdir-origin.test.ts
                test/persistence-history-fixture.test.ts
                test/persistence-image-import.serial.test.ts
                test/persistence-physical-root-device.test.ts
                test/persistence-skill-crash.slow.test.ts
                test/persistence-sync-cursor-options.test.ts
                test/persistence-sync-holds.test.ts
                test/persistence-writer-fences.test.ts
                test/repair-embedding-effects.test.ts
                test/repair-frontmatter.test.ts
                test/shared-skills-catalog.test.ts
                test/shared-skills-retention-capacity.test.ts
                test/shared-skills-source-opt-out.test.ts
                test/stats-health-source-scope.test.ts
                test/sync-frontmatter-recovery.test.ts
                test/sync-frontmatter-slug-conflict.test.ts
                test/withdrawal-publication-file.test.ts
              ) ;;
            *) echo "::error::unknown shard $SHARD" >&2; exit 1 ;;
          esac
          # One bun process per file: *.serial.test.ts files require their own
          # process, and a test that fails while its body keeps running would
          # otherwise leak process.env into every later file (one such leak
          # deleted DATABASE_URL for the rest of a shard and silently dropped
          # those files' PostgreSQL arms).
          failed=()
          for file in "${files[@]}"; do
            echo "::group::$file"
            bun --no-env-file test --timeout=120000 "$file" || failed+=("$file")
            echo "::endgroup::"
          done
          for file in ${failed[@]+"${failed[@]}"}; do
            echo "::error file=$file::PostgreSQL arm failed. Reproduce: DATABASE_URL=<pgvector test database> GBRAIN_TEST_ALLOW_DATABASE_URL=1 bun test --timeout=120000 $file"
          done
          [ "${#failed[@]}" -eq 0 ]

  invariants:
    name: ${{ matrix.engine }} / Bun ${{ matrix.bun }}
    # The soak uses 1.3-1.8 busy cores: the 2,500-write PGLite soak took 523s on
    # 4 vCPUs, 539s on 8 and 500s on 16.
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [pglite, postgres]
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Pull requests run a 2,500-write soak; pushes to master and manual runs keep
      # the full 10,000-write gate, whose PGLite run alone takes 15-28 minutes.
      - name: Execute 1000 schedules, eight SIGKILL boundaries and the process-separated write soak
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          SOAK_OPERATIONS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '2500' || '10000' }}
        run: >-
          bun --no-env-file scripts/persistence/validate.ts --engine=${{ matrix.engine }}
          --operations="$SOAK_OPERATIONS" --robot-seconds=0
          --manifest=.context/persistence-manifest.json
      - name: Upload executed-case and latency manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-${{ matrix.engine }}-bun-${{ matrix.bun }}
          path: .context/persistence-manifest.json
          if-no-files-found: error

  # The crash robot runs beside the soak: generated sequences of real operations,
  # SIGKILL at every crash seam they reach, and process faults, checked by the
  # reference model. Postgres connects through a transaction-mode PgBouncer.
  # Pull requests run a 150 s budget (Postgres skips the seams and the pooler
  # disconnect fault that can wait out a dead owner's claim lease, listed in the
  # manifest); pushes, schedules and manual runs crash every seam.
  crash-robot:
    name: Crash robot / ${{ matrix.engine }} / Bun ${{ matrix.bun }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [pglite, postgres]
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: gbrain_test
          DB_PASSWORD: gbrain_test
          POOL_MODE: transaction
          AUTH_TYPE: plain
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '10'
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout,search_path
        ports: ['55433:5432']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # The service password reaches every client through PGPASSWORD, so the URLs carry none.
      - name: Crash every reachable seam of the generated sequences
        env:
          PGPASSWORD: gbrain_test
          DATABASE_URL: postgres://gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_PGBOUNCER_URL: postgres://gbrain_test@127.0.0.1:55433/gbrain_test
          ROBOT_SECONDS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '150' || '600' }}
        run: >-
          bun --no-env-file scripts/persistence/validate.ts --engine=${{ matrix.engine }}
          --schedules=0 --operations=0 --no-crashes --robot-seconds="$ROBOT_SECONDS"
          --manifest=.context/persistence-robot.json
      - name: Replay every shrunk crash-robot failure and the history fixture
        timeout-minutes: 10
        env:
          PGPASSWORD: gbrain_test
          DATABASE_URL: postgres://gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
        run: |
          if [ '${{ matrix.engine }}' = 'postgres' ]; then
            GBRAIN_TEST_BACKEND=postgres bun --no-env-file test --timeout=300000 test/persistence-history-fixture.test.ts
          else
            env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun --no-env-file test --timeout=300000 test/persistence-crash-robot.slow.test.ts test/persistence-history-fixture.test.ts
          fi
      - name: Upload the crash-robot manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-robot-${{ matrix.engine }}-bun-${{ matrix.bun }}
          path: .context/persistence-robot.json
          if-no-files-found: error

  # The reconciliation crash suites run beside the soak instead of after it, so
  # neither holds the other's runner: each is about four minutes on PGLite.
  reconciliation:
    name: Reconciliation crashes / ${{ matrix.engine }} / Bun ${{ matrix.bun }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [pglite, postgres]
        bun: ['1.4.0', '1.4.2']
        # Pull requests run the primary Bun version; pushes, schedules and
        # manual runs keep every supported version.
        exclude: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"bun":"1.4.0"}]' || '[]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require all reconciliation crash boundaries before and after activation
        timeout-minutes: 12
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          GBRAIN_TEST_RECONCILE_CRASH_MANIFEST_DIR: .context/reconcile-crashes
        run: |
          if [ '${{ matrix.engine }}' = 'postgres' ]; then
            bun --no-env-file test --timeout=180000 test/e2e/reconcile-crash.test.ts test/e2e/reconcile-crash-unactivated.test.ts
          else
            env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun --no-env-file test --timeout=180000 test/reconcile-crash.slow.test.ts
          fi
      - name: Upload reconciliation crash manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciliation-${{ matrix.engine }}-bun-${{ matrix.bun }}
          path: .context/reconcile-crashes/*.json
          if-no-files-found: error
