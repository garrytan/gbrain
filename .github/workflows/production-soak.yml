name: Production soak

# Production-shaped scale soak (GBRA-174; harness and procedure in
# scripts/bench/production-soak/README.md). One cell per injected latency, each on
# its own ephemeral Ubicloud runner (torn down when the job ends): a
# deterministic large personal brain with years of git history and
# database-side drift, Postgres behind a session-mode PgBouncer capped at 25 and
# a transaction-mode PgBouncer, toxiproxy latency, and the production topology
# (one resident serve owning sync, a jobs worker, CLI and MCP readers, an
# external writer, put/remember, extract/embed --stale) for N hours.
# Writes a JSON scoreboard per cell. One gate blocks: after the soak, the
# search speed gate (scripts/bench/production-soak/search-gate.ts) measures warm
# search with Postgres JIT on and off on the same brain, with the upgrade rows an
# old brain keeps parked, and fails the 2 ms cell when p50 reaches 2 s, p95 3 s,
# or either regresses against the last release that passed it; the daily stable check then
# never promotes that release (docs/RELEASING.md#search-speed-gate). The 65 ms
# cell records it only. Every other gate is record-only. A gate flips to
# blocking (#7355 is closed) after two consecutive soaks are clean on it, as its
# own reviewed PR.
# Every release (release.yml dispatches it on the new tag), weekly (Monday
# 06:17 UTC) and on dispatch; never in the PR tier.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      pages:
        description: Fixture pages across the three sources (600000 is 2x the 300k bench)
        type: string
        default: '600000'
      hours:
        description: Soak duration per cell in hours
        type: string
        default: '2'
      rtts:
        description: Injected round-trip latencies in ms, comma-separated
        type: string
        default: '65,2'
      search_gate_override:
        description: Why a failing search speed gate on this run is known noise (an issue link); left empty, the gate blocks
        type: string
        default: ''

permissions:
  contents: read
  actions: read  # the search speed gate reads the last release's soak artifact

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    outputs:
      rtts: ${{ steps.plan.outputs.rtts }}
      pages: ${{ steps.plan.outputs.pages }}
      hours: ${{ steps.plan.outputs.hours }}
    steps:
      - id: plan
        env:
          RTTS: ${{ inputs.rtts || '65,2' }}
          PAGES: ${{ inputs.pages || '600000' }}
          HOURS: ${{ inputs.hours || '2' }}
        run: |
          set -euo pipefail
          [[ "$RTTS" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::rtts must be comma-separated integers, got '$RTTS'"; exit 1; }
          [[ "$PAGES" =~ ^[0-9]+$ ]] && [ "$PAGES" -ge 2000 ] || { echo "::error::pages must be an integer >= 2000, got '$PAGES'"; exit 1; }
          [[ "$HOURS" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::hours must be a number, got '$HOURS'"; exit 1; }
          {
            echo "rtts=$(printf '%s' "$RTTS" | jq -Rc 'split(",") | map(tonumber)')"
            echo "pages=$PAGES"
            echo "hours=$HOURS"
          } >> "$GITHUB_OUTPUT"

  soak:
    needs: plan
    name: Soak (${{ matrix.rtt }} ms RTT)
    runs-on: ubicloud-standard-16-ubuntu-2404
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        rtt: ${{ fromJSON(needs.plan.outputs.rtts) }}
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        continue-on-error: true
      - name: Check out again after a stalled first attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
      - name: Bootstrap (Docker images, bun, frozen dependencies)
        timeout-minutes: 20
        run: bash scripts/bench/production-soak/vm-setup.sh
      - name: Fixture, load and soak
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
          HOURS: ${{ needs.plan.outputs.hours }}
          RTT: ${{ matrix.rtt }}
        run: |
          set -o pipefail
          bash scripts/bench/production-soak/run.sh --pages "$PAGES" --rtt-ms "$RTT" --hours "$HOURS" --out "$RUNNER_TEMP/soak-out" --label "rtt$RTT"
          cat "$RUNNER_TEMP/soak-out/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Search speed gate
        timeout-minutes: 45
        # The 65 ms cell records only: a harness error or timeout there must not turn the soak red.
        continue-on-error: ${{ matrix.rtt != 2 }}
        env:
          RTT: ${{ matrix.rtt }}
          MODE: ${{ matrix.rtt == 2 && 'block' || 'record' }}
          OVERRIDE: ${{ inputs.search_gate_override }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun scripts/bench/production-soak/search-gate.ts --fixture "$HOME/soak/fixture" --work "$HOME/soak/work" --out "$RUNNER_TEMP/soak-out" \
            --rtt-ms "$RTT" --mode "$MODE" --baseline-repo "$GITHUB_REPOSITORY" --override "$OVERRIDE"
      - name: Stop the topology
        if: always()
        run: docker rm -f soak-pg soak-bouncer-session soak-bouncer-txn soak-toxiproxy >/dev/null 2>&1 || true
      - name: Upload the scoreboard, events and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-soak-rtt${{ matrix.rtt }}
          path: ${{ runner.temp }}/soak-out
          if-no-files-found: warn
