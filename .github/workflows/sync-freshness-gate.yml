name: Sync freshness gate

# Commit -> keyword-visible regression gate for the resident commit notifier
# (GBRA-133 PR 2b.6; procedure and baseline in the header of scripts/bench/sync-freshness-gate.ts).
# Cells: gbrain serve with sync.on_commit=true, watch detection, a single-file commit,
# 10k synthetic pages, on Postgres managed, PGLite managed and Postgres classic. The gate
# value is the p50 of 10 reps after one discarded warm-up; a cell fails above the committed
# baseline (scripts/bench/sync-freshness-baseline.json) + 25%. The baseline is valid only
# on this runner class (Ubicloud standard-4). Nightly and on dispatch; never in the PR tier.

on:
  schedule:
    - cron: '29 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Sync freshness gate (10k, watch, p50 of 10 vs baseline +25%)
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - name: Run the gate (builds 10k-page brains, then 11 reps per cell)
        timeout-minutes: 45
        run: |
          set -o pipefail
          git config --global user.name "Bench Example"
          git config --global user.email bench@example.invalid
          bun scripts/bench/sync-freshness-gate.ts --work-dir .context/bench/sync-freshness-gate --out .context/bench/sync-freshness-gate/run.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop harness containers and processes
        if: always()
        run: |
          pkill -9 -f 'src/cli\.ts serve' || true
          docker rm -f gbrain-bench-pg gbrain-bench-toxiproxy >/dev/null 2>&1 || true
      - name: Upload the per-cell results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sync-freshness-gate
          path: |
            .context/bench/sync-freshness-gate/run.json
            .context/bench/sync-freshness-gate/results
          include-hidden-files: true
          if-no-files-found: warn
