    # Dedicated runner for the entity-resolve perf test (~159s, single perf
    # describe with one test that builds 5000+ pages and asserts the NEW
    # tryPrefixExpansion shape is 5x faster than the OLD shape — not
    # subdivisible without weakening the perf guarantee). Pulled out of the
    # matrix (see scripts/test-shard.sh) so a single 159s atom doesn't
    # dominate a shard's wallclock. Runs in parallel with the matrix.
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            test/fixtures/pglite-snapshot.tar
            test/fixtures/pglite-snapshot.version
          key: pglite-snapshot-${{ runner.os }}-${{ hashFiles('src/core/*.ts', 'src/core/engine-sql/bootstrap.ts', 'src/core/schema-migrations/**', 'src/core/ai/defaults.ts', 'src/core/company-brain/receipt-schema.ts', 'src/core/entities/resolve.ts', 'src/core/facts/withdrawal-schema.ts', 'src/core/facts/relink-schema.ts', 'src/core/google/*.ts', 'src/core/grants/*.ts', 'src/core/minions/tools/brain-allowlist.ts', 'src/core/ops/contract.ts', 'src/core/page-state/*schema.ts', 'src/core/persistence/*.ts', 'src/core/schema-pack/link-inference.ts', 'src/core/schema-pack/redos-guard.ts', 'src/core/search/alias-normalize.ts', 'src/core/search/private-visibility.ts', 'src/core/search/projection-statistics.ts', 'src/core/search/relational-intent.ts', 'src/core/shared-skills/*schema*.ts', 'src/core/ai/decide/schema.ts', 'test/helpers/legacy-embedding-config.ts', 'scripts/build-pglite-snapshot.ts', 'src/core/facts/purge-schema.ts', 'src/core/eligibility/generation-schema.ts', 'src/core/trust/schema.ts', 'src/core/trust/tier.ts', 'src/core/trust/allow-rules.ts', 'src/core/write-gate-schema.ts') }}
      - run: bun install --frozen-lockfile
      - name: Ensure PGLite snapshot (build-or-validate, non-fatal)
        run: bash -c '. scripts/lib/test-env.sh && ensure_pglite_snapshot slow-perf && echo "GBRAIN_PGLITE_SNAPSHOT=${GBRAIN_PGLITE_SNAPSHOT:-}" >> "$GITHUB_ENV"'
      # Two bun processes: each needs its own coverage dir (a reused dir is
      # silently overwritten by the second process).
      - run: bash scripts/run-with-receipt.sh slow entity-resolve-perf -- bun test test/entity-resolve-perf.slow.test.ts --timeout=300000 --coverage --coverage-reporter=lcov --coverage-dir=${{ runner.temp }}/coverage/perf-a
        env:
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
      # MEMORY_VERBS v1 (Cathedral 1): the entity() p99 < 100ms contract gate
      # (20K-page corpus + ratio guard) shares this runner — same perf-job
      # shape, runs in parallel with the matrix.
      - run: bash scripts/run-with-receipt.sh slow entity-card-perf -- bun test test/entity-card-perf.slow.test.ts --timeout=300000 --coverage --coverage-reporter=lcov --coverage-dir=${{ runner.temp }}/coverage/perf-b
        env:
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
      # Export at scale: pull requests prove bounded keyset enumeration, sidecars
      # and fence normalization on 10,001 pages (~30s); pushes, schedules and
      # manual runs keep the 100,001-page scale (~4-10 minutes, one core).
      # Named exception (docs/TESTING.md#event-parity): covered by every push to
      # master and the nightly Test schedule.
      - run: bash scripts/run-with-receipt.sh slow export-scale -- bun test test/export-scale.slow.test.ts --timeout=900000 --coverage --coverage-reporter=lcov --coverage-dir=${{ runner.temp }}/coverage/perf-c
        env:
          GBRAIN_TEST_EXPORT_SCALE_PAGES: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '10001' || '100001' }}
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
      - name: Write coverage lane manifest
        run: |
          printf '{"lane":"slowperf","sha":"%s","lcovCount":%s,"complete":true}\n' \
            "$GITHUB_SHA" "$(find "$RUNNER_TEMP/coverage" -name lcov.info | wc -l | tr -d ' ')" \
            > "$RUNNER_TEMP/coverage/lane-manifest.json"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipts-slow-perf
          path: ${{ runner.temp }}/receipts
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: Upload coverage (slow-perf lane)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-slowperf
          path: ${{ runner.temp }}/coverage
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      # Protocol self-certification: init a scratch brain and run the
      # conformance kit against gbrain's own stdio server. --synthesize is
      # safe here: no LLM key in CI, so it asserts the clean `unavailable`
      # protocol error instead of spending tokens.
      - name: MEMORY_VERBS conformance (self-certify, stdio)
        run: |
          export GBRAIN_HOME="$RUNNER_TEMP/gbrain-conformance"
          bun run src/cli.ts init --pglite --no-embedding --non-interactive
          bun run src/cli.ts protocol conformance --synthesize

  test:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base) }}
    # Pure matrix shard — no verify, no serial. Each shard runs its slice
    # of the unit test set under one `bun test` invocation.
    #
    # 8 shards: ~2,750s of mined file time (after export-scale and
    # reconcile-crash left the matrix) is ~344s per shard.
    #
    # Partition policy is weight-aware LPT bin-packing via scripts/sharding.ts
    # (replaces FNV-1a path hash). Weights live in scripts/test-weights.json,
    # mined from real CI logs via scripts/mine-shard-weights.ts. Missing
    # weights fall back to corpus median — new test files work immediately.
    # 4 vCPUs: a shard is one bun process (1.1-1.5 busy cores on average), but
    # on 2 vCPUs the unit shard mean rose from 542s to 608s on PR #6013 and
    # made Test the PR critical path, so shards stay on 4.
    runs-on: ubicloud-standard-4-ubuntu-2404
    # 22, not 15: under parallel PR load the PGLite WASM cold-starts stretch a
    # shard past 15 min while every test is still passing — the timeout then
    # cancels the job and the test-status gate reads it as a failure. 13 runs
    # died this way on 2026-07-21/22 alone.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      # Restore-only: test-shard.sh validates the snapshot's runtime hash and
      # rebuilds when stale (the serial-tests job is the designated saver).
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            test/fixtures/pglite-snapshot.tar
            test/fixtures/pglite-snapshot.version
          key: pglite-snapshot-${{ runner.os }}-${{ hashFiles('src/core/*.ts', 'src/core/engine-sql/bootstrap.ts', 'src/core/schema-migrations/**', 'src/core/ai/defaults.ts', 'src/core/company-brain/receipt-schema.ts', 'src/core/entities/resolve.ts', 'src/core/facts/withdrawal-schema.ts', 'src/core/facts/relink-schema.ts', 'src/core/google/*.ts', 'src/core/grants/*.ts', 'src/core/minions/tools/brain-allowlist.ts', 'src/core/ops/contract.ts', 'src/core/page-state/*schema.ts', 'src/core/persistence/*.ts', 'src/core/schema-pack/link-inference.ts', 'src/core/schema-pack/redos-guard.ts', 'src/core/search/alias-normalize.ts', 'src/core/search/private-visibility.ts', 'src/core/search/projection-statistics.ts', 'src/core/search/relational-intent.ts', 'src/core/shared-skills/*schema*.ts', 'src/core/ai/decide/schema.ts', 'test/helpers/legacy-embedding-config.ts', 'scripts/build-pglite-snapshot.ts', 'src/core/facts/purge-schema.ts', 'src/core/eligibility/generation-schema.ts', 'src/core/trust/schema.ts', 'src/core/trust/tier.ts', 'src/core/trust/allow-rules.ts', 'src/core/write-gate-schema.ts') }}
      - run: bun install --frozen-lockfile
      - name: Run test shard ${{ matrix.shard }}/8
        shell: bash
        run: bun scripts/capture-test-log.ts --job 'test (${{ matrix.shard }})' --out "$RUNNER_TEMP/unit.log" -- bash scripts/test-shard.sh ${{ matrix.shard }} 8
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipts-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/receipts
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: Upload coverage (shard lane)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - name: Upload unit timing log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timings-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit.log
          retention-days: 14
          overwrite: true


  # ──────────────────────────────────────────────────────────────────────
  # coverage-report: merges the PR corpus (8 unit + 4 serial + 2 slow
  # lanes) into one honest number, renders it to the step summary, and runs
  # the diff + baseline gates in report-only mode (COVERAGE_GATE_ENFORCE=0).
  # ADVISORY during the report-only window: deliberately NOT in test-status's
  # required set — coverage reporting stays advisory until the gate
  # graduates (that PR adds it to the aggregate and flips ENFORCE).
  # `always()` is load-bearing: without it, a failed shard skips this job at
  # exactly the moment the (degraded) report matters most.
  # ──────────────────────────────────────────────────────────────────────
  coverage-report:
    needs: [serial-tests, slow-entity-resolve-perf, slow-brainbench-e2e, test]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base)) }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # diff gate needs origin/master; baseline gate reads git show origin/master:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download per-lane coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Merge lanes
        env:
          COVERAGE_CORPUS: prCorpus
        run: |
          bun scripts/merge-lcov.ts \
            --out-lcov "$RUNNER_TEMP/coverage-merged/lcov.info" \
            --out-json "$RUNNER_TEMP/coverage-merged/summary.json" \
            --manifest-expect shard-1,shard-2,shard-3,shard-4,shard-5,shard-6,shard-7,shard-8,serial-1,serial-2,serial-3,serial-4,slowperf,slowbrainbench \
            "$RUNNER_TEMP/coverage-artifacts"
      - name: Coverage summary → step summary
        run: bun scripts/render-coverage-summary.ts --summary "$RUNNER_TEMP/coverage-merged/summary.json" --structural scripts/structural-suites.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Diff coverage gate (report-only until graduation)
        # shell: bash is load-bearing: the default `bash -e {0}` has NO
        # pipefail, so the tee pipe would mask the gate's exit code — the
        # graduated gate could never fail the job.
        shell: bash
        env:
          COVERAGE_GATE_ENFORCE: '0'
        run: bun scripts/coverage-diff-gate.ts --summary "$RUNNER_TEMP/coverage-merged/summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Baseline gate (prCorpus, like-for-like)
        shell: bash
        env:
          COVERAGE_GATE_ENFORCE: '0'
        run: bun scripts/coverage-baseline-gate.ts --summary "$RUNNER_TEMP/coverage-merged/summary.json" --corpus prCorpus | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-merged
          path: ${{ runner.temp }}/coverage-merged
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  native-locks:
    needs: [changes]
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base) }}
    uses: ./.github/workflows/native-locks.yml
    with:
      scope: ${{ needs.changes.outputs.native-scope }}

  persistence-validation:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base) }}
    uses: ./.github/workflows/persistence-validation.yml

  # PR stress gate (docs/TESTING.md#stress-gate): every added or modified test
  # file, plus direct importers of changed test/helpers/ files by the fan-in
  # rule, runs 10 times with a fresh database per iteration. Named exception
  # (docs/TESTING.md#event-parity): outside pull_request and merge_group it
  # succeeds with "not a PR event", since push and nightly runs execute every
  # file. Its conclusion is success or failure, never skipped, so test-status
  # gates on it.
  stress-changed-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.native_only != true }}
    permissions:
      contents: read
      issues: read
      actions: read
    uses: ./.github/workflows/stress.yml
    with:
      mode: gate
      stress_files: ${{ inputs.stress_files || '' }}
      stress_base: ${{ inputs.stress_base || '' }}
      stress_head: ${{ inputs.stress_head || '' }}

  # Race hunt (docs/TESTING.md#race-hunt): every file in test/postgres-unit-arms.txt
  # 10 times against Postgres. Named exception (docs/TESTING.md#event-parity):
  # the nightly Test schedule and a race_hunt dispatch only, and outside
  # test-status: a red lands in the Test nightly-red issue, one line per file.
  race-hunt:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.race_hunt == true) }}
    permissions:
      contents: read
      issues: read
      actions: read
    uses: ./.github/workflows/stress.yml
    with:
      mode: race-hunt

  admin-browser:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base) }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: admin
      - name: Install the pinned Chromium browser and OS dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build the shipped admin assets
        run: bun run build:admin
      - name: Exercise owner administration and native OAuth in Chromium
        run: bun run test:admin
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: admin-browser-failures
          path: .context/admin-browser-results
          include-hidden-files: true
          retention-days: 7

  shared-skills-compatibility:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base) }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the pinned pre-feature executable
        run: bash scripts/build-shared-skills-baseline.sh "$RUNNER_TEMP/gbrain-before-shared-skills"
      - name: Reject old consumers before they change shared skill state
        env:
          GBRAIN_TEST_OLD_BINARY: ${{ runner.temp }}/gbrain-before-shared-skills
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/run-with-receipt.sh shared-skills old-binary -- bun test --timeout 180000 test/persistence-skill-old-binary.slow.test.ts
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipts-shared-skills
          path: ${{ runner.temp }}/receipts
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

  # Report-only executed-test ledger (X2): every lane's receipts in one
  # identity table (step summary + JSON artifact). Not in test-status: a
  # comparison against a baseline run is the parent's local call:
  #   bun scripts/ci-executed-counts.ts --base-run <id> --head-run <id>
  executed-receipts:
    needs: [verify, serial-tests, slow-entity-resolve-perf, slow-brainbench-e2e, test, shared-skills-compatibility, persistence-validation]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base)) }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          sparse-checkout: |
            scripts/ci-executed-counts.ts
            scripts/ci-manifest.ts
            docs/test-audit/2026-10-04/expected-deltas.tsv
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - name: Download receipts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: receipts-*
          path: ${{ runner.temp }}/receipts
      - name: Executed-test identities → step summary (report-only)
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          bun scripts/ci-executed-counts.ts --head-dir "$RUNNER_TEMP/receipts" --report-only \
            --expect-attempt "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RUNNER_TEMP/executed-identities.json" > /dev/null
      - name: Upload identity ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executed-identities
          path: ${{ runner.temp }}/executed-identities.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      # Versioned failure and execution manifest bound to this SHA, run and
      # attempt; nightly-watch reads it to list every failing test and to
      # prove a file ran and passed before it clears a master-red failure.
      - name: Failure and execution manifest (nightly-watch evidence)
        if: always()
        run: bun scripts/ci-manifest.ts --receipts-dir "$RUNNER_TEMP/receipts" --out "$RUNNER_TEMP/ci-manifest.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload failure manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-manifest
          path: ${{ runner.temp }}/ci-manifest.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

  # The stable aggregate succeeds only when every required lane ran successfully.
  # Coverage percentages remain advisory until their separate graduation.
  test-status:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_only == true || inputs.race_hunt == true || inputs.stress_files != '' || inputs.stress_base != '') && 'full-suite-not-run' || 'test-status' }}
    needs: [gitleaks, security-regressions, dependency-audit, verify, serial-tests, slow-entity-resolve-perf, slow-brainbench-e2e, brainbench, test, native-locks, persistence-validation, admin-browser, shared-skills-compatibility, stress-changed-tests]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.native_only != true && inputs.race_hunt != true && !inputs.stress_files && !inputs.stress_base)) }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        run: |
          GITLEAKS="${{ needs.gitleaks.result }}"
          SECURITY="${{ needs.security-regressions.result }}"
          AUDIT="${{ needs.dependency-audit.result }}"
          VERIFY="${{ needs.verify.result }}"
          SERIAL="${{ needs.serial-tests.result }}"
          SLOW_PERF="${{ needs.slow-entity-resolve-perf.result }}"
          SLOW_BRAINBENCH="${{ needs.slow-brainbench-e2e.result }}"
          BRAINBENCH="${{ needs.brainbench.result }}"
          TEST="${{ needs.test.result }}"
          NATIVE_LOCKS="${{ needs.native-locks.result }}"
          PERSISTENCE="${{ needs.persistence-validation.result }}"
          ADMIN_BROWSER="${{ needs.admin-browser.result }}"
          SKILL_COMPATIBILITY="${{ needs.shared-skills-compatibility.result }}"
          STRESS="${{ needs.stress-changed-tests.result }}"
          echo "gitleaks=$GITLEAKS  security-regressions=$SECURITY  dependency-audit=$AUDIT  verify=$VERIFY  serial-tests=$SERIAL  slow-entity-resolve-perf=$SLOW_PERF  slow-brainbench-e2e=$SLOW_BRAINBENCH  brainbench=$BRAINBENCH  test=$TEST  native-locks=$NATIVE_LOCKS  persistence=$PERSISTENCE  admin-browser=$ADMIN_BROWSER"
          echo "shared-skills-compatibility=$SKILL_COMPATIBILITY  stress-changed-tests=$STRESS"
          for r in "$GITLEAKS" "$SECURITY" "$AUDIT" "$VERIFY" "$SERIAL" "$SLOW_PERF" "$SLOW_BRAINBENCH" "$BRAINBENCH" "$TEST" "$NATIVE_LOCKS" "$PERSISTENCE" "$ADMIN_BROWSER" "$SKILL_COMPATIBILITY" "$STRESS"; do
            if [ "$r" != "success" ]; then
              echo "✗ gated job did not succeed (got $r) — CI fail"
              exit 1
            fi
          done
          echo "✓ all gated jobs succeeded — CI green"


  # A native-only run emits its own scoped result, never the required full-suite check.
  native-only-status:
    name: Native-only result (full CI not run)
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.native_only == true }}
    needs: [native-locks]
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Record validation scope
        env:
          NATIVE_RESULT: ${{ needs.native-locks.result }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          case "$NATIVE_RESULT" in success|failure|cancelled|skipped) ;; *) exit 1 ;; esac
          printf '{"scope":"native-only","full_ci":false,"head":"%s","run_id":"%s","native_result":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$NATIVE_RESULT" > native-only-scope.json
          echo 'Native-only validation. The full Test suite was not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-only-validation-scope
          path: native-only-scope.json
          if-no-files-found: error
          retention-days: 14
      - name: Require native success
        env:
          NATIVE_RESULT: ${{ needs.native-locks.result }}
        run: test "$NATIVE_RESULT" = success
