name: Rust engine

# Checks for the optional Rust engine under rust/. Rust is never required to build or run
# gbrain: the last job proves that by removing Rust from PATH and building the normal binary.
#
# Jobs:
#   checks     formatting, clippy, unit tests, and cargo-deny (licenses, sources, advisories).
#              The advisory check downloads the RustSec database, so it needs network access.
#   addon      builds the addon (`bun run rust:build`) and runs the Bun smoke test
#              (rust/smoke/run.ts, including a `bun build --compile` executable) on Linux x64 and
#              macOS arm64, then runs the engine tests against the built addon (the store tests and
#              the Rust arm of the engine parity suite), then the CLI parity test
#              (test/rust-cli-parity.serial.test.ts: each read command on a Rust brain is equal to
#              PGLite, refused with a typed refusal, or has no Rust engine; only a diverged command
#              fails), checks that the built addon, installed as a release asset, loads with no override, then
#              uploads the .node file (releases build and publish the addon in release.yml, not here). Each target
#              (Linux and macOS) is two matrix
#              halves, each under 45 minutes: both build the addon and run the smoke test, each
#              runs half of the parity files, and the CLI parity steps are divided between them
#              (see the addon job).
#   addon-linux-gate, addon-darwin-gate  one check per target named like the old single cell
#              ("Addon and Bun smoke / <target>"): green only when every half of that target passed.
#   without-rust  no Rust on PATH: bun install, bun run build, ./bin/gbrain --version.
#   keyword-goldens  proves the generated and golden keyword-search files are what PostgreSQL 18.6
#              says: parser/actions.rs and parser/charclass.rs are regenerated and compared, and the
#              three golden fixtures are recomputed on PGLite 0.5.16 and compared (check mode, no
#              files are written). Needs network: npm for PGLite 0.5.16, raw.githubusercontent.com for
#              PostgreSQL's wparser_def.c. Third-party notices: third-party/postgresql/NOTICE.md.
#   scope      reads a pull request's changed files and picks the advisory check and addon cells.
#
# Runs only when something the Rust engine depends on changes (the path list below). The two
# rust-unit-arms entries start with `**/` because those files arrive in a later change and the
# repo's doc-path check rejects a plain path to a file that does not exist yet; the pattern still
# matches the same files.
#
# Event parity (docs/TESTING.md#event-parity), named exceptions:
#   - The macOS addon cell runs on pushes to master, on workflow_dispatch, and on pull requests
#     that change rust/** or the loader files (src/core/rust-engine.ts, src/core/rust-engine/**).
#     macOS runners are the landing line's bottleneck. Covered by every push to master.
#   - The cargo-deny advisory check runs on a pull request only when it changes rust/** (which
#     holds rust/Cargo.lock), so a new RustSec advisory cannot turn an unrelated pull request red.
#     Covered by every push to master and the daily Rust engine schedule, which runs only `checks`.
#   - The keyword-goldens job runs on a pull request only when it changes rust/**, and not on the
#     schedule. It compares committed files with PostgreSQL 18.6 output, which does not drift.
#     Covered by every push to master.

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'src/core/rust-engine**'
      - 'src/core/rust-engine/**'
      - 'test/engine-parity/**'
      - 'test/rust-engine-*.test.ts'
      - 'src/shadow/**'
      - 'test/rust-expected-divergence/**'
      - 'src/core/sql-engine-kind.ts'
      - 'src/core/engine.ts'
      - 'src/core/engine-*.ts'
      - 'src/core/engine-sql/**'
      - 'src/schema.sql'
      - 'src/core/migrate.ts'
      - 'src/core/schema-migrations/**'
      - 'src/core/persistence/graduation-*.ts'
      - 'test/helpers/test-backends.ts'
      - '**/test/rust-unit-arms.txt'
      - '**/scripts/rust-unit-arms.ts'
      - 'test/rust-cli-parity.serial.test.ts'
      - 'test/token-member-cli-parity.serial.test.ts'
      - 'test/rust-mcp-receipts.serial.test.ts'
      - 'test/fixtures/rust-cli-parity-brain/**'
      - '.github/workflows/rust-engine.yml'
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'src/core/rust-engine**'
      - 'src/core/rust-engine/**'
      - 'test/engine-parity/**'
      - 'test/rust-engine-*.test.ts'
      - 'src/shadow/**'
      - 'test/rust-expected-divergence/**'
      - 'src/core/sql-engine-kind.ts'
      - 'src/core/engine.ts'
      - 'src/core/engine-*.ts'
      - 'src/core/engine-sql/**'
      - 'src/schema.sql'
      - 'src/core/migrate.ts'
      - 'src/core/schema-migrations/**'
      - 'src/core/persistence/graduation-*.ts'
      - 'test/helpers/test-backends.ts'
      - '**/test/rust-unit-arms.txt'
      - '**/scripts/rust-unit-arms.ts'
      - 'test/rust-cli-parity.serial.test.ts'
      - 'test/token-member-cli-parity.serial.test.ts'
      - 'test/rust-mcp-receipts.serial.test.ts'
      - 'test/fixtures/rust-cli-parity-brain/**'
      - '.github/workflows/rust-engine.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'  # daily 07:17 UTC: cargo-deny advisories on master (checks job only)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  # Event parity (docs/TESTING.md#event-parity): see the named exceptions in the header. Off a
  # pull request every output is the full set. On a pull request whose file list cannot be read
  # (the API stops at 3000 files, or the call fails), everything runs.
  scope:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      targets: ${{ steps.scope.outputs.targets }}
    steps:
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          rust=true
          macos=true
          if [ "$EVENT" = pull_request ]; then
            if [[ "$CHANGED_FILES" =~ ^[0-9]{1,4}$ ]] && [ "$CHANGED_FILES" -lt 3000 ] \
              && files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename'); then
              grep -Eq '^rust/' <<< "$files" || rust=false
              grep -Eq '^(rust/|src/core/rust-engine(\.ts$|/))' <<< "$files" || macos=false
            fi
          fi
          # shard/shards: this cell runs the parity files whose position (sorted, counted from 1) is
          # congruent to shard modulo shards. label is the job name suffix. The check named with the bare
          # target is a gate job that needs every half of that target (addon-linux-gate, addon-darwin-gate).
          # One Linux cell reached 29 min of its 30 (the parity step went from 17 to 24 min), so Linux is split in two as well.
          linux1='{"target":"linux-x64-glibc","runner":"ubicloud-standard-4-ubuntu-2404","shard":"1","shards":"2","label":"linux-x64-glibc (1 of 2)"}'
          linux2='{"target":"linux-x64-glibc","runner":"ubicloud-standard-4-ubuntu-2404","shard":"2","shards":"2","label":"linux-x64-glibc (2 of 2)"}'
          # Unverified before the first CI run: the dylib name (libgbrain_napi.dylib) and Bun
          # loading an unsigned .node with process.dlopen.
          # One macOS cell took 43 min in run 45126845000 (cap 45); two halves keep each under 30.
          darwin1='{"target":"darwin-arm64","runner":"macos-26","shard":"1","shards":"2","label":"darwin-arm64 (1 of 2)"}'
          darwin2='{"target":"darwin-arm64","runner":"macos-26","shard":"2","shards":"2","label":"darwin-arm64 (2 of 2)"}'
          if [ "$macos" = true ]; then targets="[$linux1,$linux2,$darwin1,$darwin2]"; else targets="[$linux1,$linux2]"; fi
          echo "scope: event=$EVENT rust=$rust macos=$macos"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  checks:
    name: Format, clippy, unit tests, cargo-deny
    needs: scope
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 25
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Check out again after a stalled first attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      # rustup reads the pinned version from rust/rust-toolchain.toml. Every runner this workflow
      # uses ships rustup; a runner without it fails here rather than piping an installer into sh.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not installed on this runner. Use a runner image that ships rustup."
            exit 1
          fi
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/rust/rust-toolchain.toml")"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup default "$channel"
          rustc --version
          cargo --version
      # The cache name is built in a step so the cache key line holds no long literal value.
      - name: Name the cache from the lock file and toolchain
        id: cachename
        run: echo "value=rust-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cachename.outputs.value }}
          restore-keys: |
            rust-checks-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: rust
        run: cargo test --locked
      # The same store suite on the optimistic record file: the plain openers read this variable, and
      # the tests that name a mode (`_single`, `_optimistic`) run in both modes either way.
      - name: Unit tests, optimistic store
        working-directory: rust
        env:
          GBRAIN_RUST_CONCURRENT_WRITES: "1"
        run: cargo test --locked -p gbrain-store
      # A pinned prebuilt binary, checked against its SHA-256, so CI does not compile cargo-deny
      # and does not depend on a third-party action.
      - name: Install cargo-deny 0.21.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 -o "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/$archive"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-deny-bin"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cargo-deny-bin" cargo-deny-0.21.0-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP/cargo-deny-bin" >> "$GITHUB_PATH"
      - name: cargo-deny (licenses, bans, sources)
        working-directory: rust
        run: cargo deny --locked check licenses bans sources
      # Event parity (docs/TESTING.md#event-parity): named exception, see the header.
      - name: cargo-deny (advisories)
        if: needs.scope.outputs.rust == 'true'
        working-directory: rust
        run: cargo deny --locked check advisories

  # Event parity (docs/TESTING.md#event-parity): the scope job picks the cells (named exception in
  # the header); the schedule runs only `checks`. macOS minutes cost more than Linux.
  addon:
    name: Addon and Bun smoke / ${{ matrix.label }}
    needs: scope
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    # darwin-arm64 runners run about 1.3x slower; one cell took 43 min in run 45126845000 (the parity loop took 33 min of it).
    # Each target is therefore two halves (shard 1 and 2 of 2), and every cell has the same 45 minute cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.targets) }}
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Check out again after a stalled first attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      # rustup reads the pinned version from rust/rust-toolchain.toml. Every runner this workflow
      # uses ships rustup; a runner without it fails here rather than piping an installer into sh.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not installed on this runner. Use a runner image that ships rustup."
            exit 1
          fi
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/rust/rust-toolchain.toml")"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustup default "$channel"
          rustc --version
          cargo --version
      # The cache name is built in a step so the cache key line holds no long literal value.
      - name: Name the cache from the lock file and toolchain
        id: cachename
        run: echo "value=rust-addon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.cachename.outputs.value }}
          restore-keys: |
            rust-addon-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the addon
        run: bun run rust:build
      - name: Smoke test under Bun (in-process cases, process.exit, compiled executable)
        shell: bash
        run: |
          set -euo pipefail
          export GBRAIN_RUST_ENGINE_ADDON="$PWD/rust/target/addon/gbrain_engine.${{ matrix.target }}.node"
          test -f "$GBRAIN_RUST_ENGINE_ADDON"
          bun rust/smoke/run.ts
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      # The engine on the real store: test/rust-engine-store.test.ts and the raw-value differential against
      # PGLite (test/rust-engine-differential.test.ts), then every parity file with the Rust
      # arm added (GBRAIN_TEST_RUST_ARM=1). The addon is required here, so a missing build fails the step
      # instead of skipping. Each file runs in its own Bun process, as the parity suite does elsewhere.
      # A cell with shards > 1 runs only its share: the store tests on shard 1, and every parity file whose
      # position in the sorted list, counted from 1, leaves shard - 1 when divided by shards (no bash 4 features:
      # the macOS runner shell may be bash 3.2). Every file lands in exactly one shard of its target.
      - name: Rust engine store tests and the parity suite's Rust arm
        shell: bash
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
          GBRAIN_TEST_RUST_ARM: '1'
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          if [ "$SHARD" = 1 ]; then
            bun test --timeout=60000 test/rust-engine-store.test.ts test/rust-engine-shell.test.ts test/rust-engine-differential.test.ts test/rust-managed-hold.test.ts test/rust-managed-recovery-hold.test.ts test/rust-managed-refresh-hold.test.ts
          fi
          position=0
          ran=0
          while IFS= read -r file; do
            position=$((position + 1))
            [ $(( (position - 1) % SHARDS )) -eq $(( SHARD - 1 )) ] || continue
            [ -f "$file" ] || { echo "::error::parity file $file does not exist"; exit 1; }
            bun test --timeout=60000 "$file"
            ran=$((ran + 1))
          done < <(printf '%s\n' test/engine-parity/*.test.ts | LC_ALL=C sort)
          echo "parity shard $SHARD of $SHARDS: ran $ran of $position files"
          [ "$ran" -gt 0 ] || { echo "::error::parity shard $SHARD of $SHARDS ran no file"; exit 1; }
      # Managed mode on Rust (lane LM): slice 2 lifted the managed_persistence hold on a single-host store, so the
      # ordinary parity run above covers the managed files and rust-managed-tally.tsv equals rust-tally.tsv. Slice 3 serves
      # a multi-user store too: the managed parity files run again with the multi-user switch on for the Rust arm
      # (`rust-mu-env`, equal to PGLite and Postgres), with the multi-user lock, caller, fairness and claim-fence tests.
      - name: Managed mode on a multi-user Rust brain (parity with the multi-user switch on, lock and fence tests)
        if: matrix.shard == '1'
        shell: bash
        timeout-minutes: 40
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
          GBRAIN_TEST_RUST_ARM: '1'
          GBRAIN_TEST_RUST_MU_ARM: env
        run: |
          set -euo pipefail
          bun test --timeout=120000 test/managed-lock.test.ts test/managed-multiuser-callers.test.ts test/managed-multiuser-fairness.test.ts test/rust-managed-claim-fences.test.ts test/managed-lock-callers.test.ts
          for file in test/engine-parity/managed-*-on-rust.test.ts test/engine-parity/sync-stamp.test.ts; do
            [ -f "$file" ] || { echo "::error::parity file $file does not exist"; exit 1; }
            bun test --timeout=240000 "$file"
          done
      # Each read command runs through the real CLI on a PGLite brain and a Rust brain. A command
      # that is equal, refused with engine_capability_missing, or has no Rust engine passes; a
      # diverged command (another answer, an untyped error) fails. The flag makes a missing addon
      # an error instead of a skip.
      # The steps from here to the artifact upload are divided between the halves of a split cell
      # (CLI parity and the withdrawn-lead lane on shard 1, the token and MCP steps on the last shard) so the
      # halves finish together; a cell with a single shard would run all of them.
      - name: CLI parity on a Rust brain against PGLite (no diverged command)
        if: matrix.shard == '1'
        timeout-minutes: 15
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
        run: bun test --timeout=60000 test/rust-cli-parity.serial.test.ts
      # --source reaches the Rust brain (master PR 9946).
      - name: CLI --source reaches the Rust brain
        if: matrix.shard == '1'
        timeout-minutes: 5
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
          GBRAIN_TEST_REQUIRE_RUST_ADDON: '1'
        run: bun test --timeout=60000 test/rust-cli-source-target.test.ts
      # `gbrain engine install rust` with the addon just built served as the release asset: the install checks it and
      # the real loader then opens it from the gbrain home with no GBRAIN_RUST_ENGINE_ADDON. A missing build fails here.
      - name: The installed release addon loads with no override
        if: matrix.shard == '1'
        shell: bash
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
        run: bun test --timeout=60000 test/rust-engine-addon-install.test.ts
      # A withdrawn world claim stays out of a large page's lead on a Rust brain. GBRAIN_TEST_REQUIRE_RUST_ADDON
      # makes a missing addon an error instead of a skip, and the next step fails the lane when no test ran.
      # This job owns the file, so the stress gate does not stress it where no addon exists.
      - name: Withdrawn claims stay out of a Rust page lead
        if: matrix.shard == '1'
        shell: bash
        env:
          GBRAIN_TEST_REQUIRE_RUST_ADDON: '1'
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/run-with-receipt.sh rust-store withdrawn-lead -- bun test --timeout=60000 test/rust-engine-withdrawn-lead.test.ts
      # The shadow seed leaves the swap's writer-evidence tables behind (rust seed::NOT_COPIED). Same ownership rule as
      # above: a missing addon is an error here, and the next step fails the lane when no test ran.
      - name: The shadow seed skips the writer-evidence tables
        shell: bash
        env:
          GBRAIN_TEST_REQUIRE_RUST_ADDON: '1'
          GBRAIN_TEST_RECEIPT_DIR: ${{ runner.temp }}/receipts
        run: bash scripts/run-with-receipt.sh rust-store writer-seed -- bun test --timeout=60000 test/shadow-writer-seed.test.ts
      - name: Fail the withdrawn-lead lane when no test ran
        if: matrix.shard == '1'
        shell: bash
        run: bun scripts/require-executed-tests.ts "$RUNNER_TEMP/receipts" rust-store
      # The token and member commands print the same bytes on a Rust brain as on PGLite.
      - name: Token and member command output on a Rust brain against PGLite
        if: matrix.shard == matrix.shards
        timeout-minutes: 10
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
        run: bun test --timeout=60000 test/token-member-cli-parity.serial.test.ts
      # The write-request receipt tools through a stdio serve on a new Rust brain answer as on PGLite.
      - name: MCP receipt tools on a Rust brain against PGLite
        if: matrix.shard == matrix.shards
        timeout-minutes: 5
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
        run: bun test --timeout=150000 test/rust-mcp-receipts.serial.test.ts
      # Both halves of a split cell build the same addon; shard 1 uploads it under the unchanged name.
      - if: matrix.shard == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-engine-addon-${{ matrix.target }}
          path: rust/target/addon/gbrain_engine.${{ matrix.target }}.node
          if-no-files-found: error
          # The Nov 26 shadow build's addon is the evidence file's addon: keep it for the whole shadow window.
          retention-days: 90

  # One check per target named like the single cell used to be ("Addon and Bun smoke / <target>"). It passes
  # only when every half of that target's addon cells succeeded: it reads the conclusion of each job named
  # "Addon and Bun smoke / <target> (n of m)" in this run, and fails when one is not a success or fewer than the
  # scope job's cells for that target are there. `needs.addon.result` alone would also fail on the other target's
  # failure, so the cells are read one by one. Skipped on the schedule, and the macOS gate when the scope job
  # picked no macOS cell (like the macOS cells).
  addon-linux-gate:
    name: Addon and Bun smoke / linux-x64-glibc
    needs: [scope, addon]
    if: ${{ !cancelled() && github.event_name != 'schedule' && contains(needs.scope.outputs.targets, '"linux-x64-glibc"') }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every Linux half of the addon job passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGETS: ${{ needs.scope.outputs.targets }}
          TARGET: linux-x64-glibc
        run: |
          set -euo pipefail
          want=$(jq --arg t "$TARGET" '[.[] | select(.target == $t)] | length' <<< "$TARGETS")
          # filter=all, newest attempt per half: re-running only this check leaves the halves in an earlier
          # attempt, which filter=latest drops. Wait (bounded) while a half shows no conclusion: the jobs API
          # can lag a half that finished seconds before this job started.
          deadline=$(( $(date +%s) + ${GATE_POLL_SECS:-240} ))
          while :; do
            rows=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
              --jq ".jobs[] | select(.name | startswith(\"Addon and Bun smoke / $TARGET (\")) | [.name, (.run_attempt // 1), (.conclusion // \"running\")] | @tsv" \
              | sort -t $'\t' -k1,1 -k2,2n | awk -F'\t' 'NF { last[$1] = $3 } END { for (n in last) print n "\t" last[n] }' | sort)
            printf '%s\n' "$rows"
            printf '%s\n' "$rows" | awk -F'\t' '$2 == "running"' | grep -q . || break
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep "${GATE_POLL_INTERVAL:-10}"
          done
          have=$(printf '%s\n' "$rows" | grep -c . || true)
          ok=$(printf '%s\n' "$rows" | awk -F'\t' '$2 == "success"' | grep -c . || true)
          echo "$TARGET halves expected $want, found $have, passed $ok"
          [ "$want" -gt 0 ] && [ "$have" -eq "$want" ] && [ "$ok" -eq "$want" ] || { echo "::error::not every $TARGET half of the addon job passed"; exit 1; }

  addon-darwin-gate:
    name: Addon and Bun smoke / darwin-arm64
    needs: [scope, addon]
    if: ${{ !cancelled() && github.event_name != 'schedule' && contains(needs.scope.outputs.targets, '"darwin-arm64"') }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every macOS half of the addon job passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGETS: ${{ needs.scope.outputs.targets }}
          TARGET: darwin-arm64
        run: |
          set -euo pipefail
          want=$(jq --arg t "$TARGET" '[.[] | select(.target == $t)] | length' <<< "$TARGETS")
          # filter=all, newest attempt per half: re-running only this check leaves the halves in an earlier
          # attempt, which filter=latest drops. Wait (bounded) while a half shows no conclusion: the jobs API
          # can lag a half that finished seconds before this job started.
          deadline=$(( $(date +%s) + ${GATE_POLL_SECS:-240} ))
          while :; do
            rows=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
              --jq ".jobs[] | select(.name | startswith(\"Addon and Bun smoke / $TARGET (\")) | [.name, (.run_attempt // 1), (.conclusion // \"running\")] | @tsv" \
              | sort -t $'\t' -k1,1 -k2,2n | awk -F'\t' 'NF { last[$1] = $3 } END { for (n in last) print n "\t" last[n] }' | sort)
            printf '%s\n' "$rows"
            printf '%s\n' "$rows" | awk -F'\t' '$2 == "running"' | grep -q . || break
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep "${GATE_POLL_INTERVAL:-10}"
          done
          have=$(printf '%s\n' "$rows" | grep -c . || true)
          ok=$(printf '%s\n' "$rows" | awk -F'\t' '$2 == "success"' | grep -c . || true)
          echo "$TARGET halves expected $want, found $have, passed $ok"
          [ "$want" -gt 0 ] && [ "$have" -eq "$want" ] && [ "$ok" -eq "$want" ] || { echo "::error::not every $TARGET half of the addon job passed"; exit 1; }

  # Event parity (docs/TESTING.md#event-parity): the schedule runs only `checks`.
  # Check mode only: each command exits 1 if a committed file differs from what PostgreSQL 18.6 produces.
  # Event parity (docs/TESTING.md#event-parity): runs on every event this workflow runs on except the
  # schedule, and on a pull request only when it changes rust/** (the scope job), like the advisory check.
  keyword-goldens:
    name: Keyword search goldens match PostgreSQL 18.6
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.rust == 'true'
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Check out again after a stalled first attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      # PGLite 0.5.16 (PostgreSQL 18.6) goes into this scratch directory, never into node_modules.
      - name: parser/actions.rs matches wparser_def.c at REL_18_6
        timeout-minutes: 3
        run: bun rust/scripts/gen-parser-actions.ts
      - name: parser/charclass.rs matches the PostgreSQL 18.6 character classes
        timeout-minutes: 5
        env:
          GBRAIN_PGLITE_GOLDEN_DIR: ${{ runner.temp }}/pglite-0.5.16
        run: bun rust/scripts/gen-parser-charclass.ts
      - name: english_stem.tsv, ts_parse.json and tsearch.json match PostgreSQL 18.6
        timeout-minutes: 5
        env:
          GBRAIN_PGLITE_GOLDEN_DIR: ${{ runner.temp }}/pglite-0.5.16
        run: bun rust/crates/gbrain-store/tests/fixtures/regen-search-goldens.ts

  without-rust:
    name: Builds and runs with no Rust installed
    if: github.event_name != 'schedule'
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Check out again after a stalled first attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - name: Remove Rust from PATH, then build and run gbrain
        shell: bash
        run: |
          set -euo pipefail
          # Drop every PATH directory that holds cargo, rustc or rustup. System directories are kept;
          # if Rust lives in one, the check below fails loudly instead of breaking the shell.
          filtered=""
          IFS=: read -r -a dirs <<< "$PATH"
          for dir in "${dirs[@]}"; do
            case "$dir" in
              /usr/bin|/bin|/usr/local/bin|/usr/sbin|/sbin)
                filtered="${filtered:+$filtered:}$dir"
                continue
                ;;
            esac
            if [ -e "$dir/cargo" ] || [ -e "$dir/rustc" ] || [ -e "$dir/rustup" ]; then
              echo "removing from PATH: $dir"
              continue
            fi
            filtered="${filtered:+$filtered:}$dir"
          done
          export PATH="$filtered"
          for tool in cargo rustc rustup; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is still on PATH: $(command -v "$tool")"
              exit 1
            fi
          done
          bun run build
          ./bin/gbrain --version
          # The Rust build script must refuse politely, not half-build.
          if bun run rust:build > rust-build.log 2>&1; then
            echo "::error::rust:build succeeded without cargo"
            exit 1
          fi
          grep -q 'cargo was not found' rust-build.log
