name: Native writer locks

on:
  workflow_call:
    inputs:
      # full: every Bun version on every target (push, schedule, manual runs).
      # primary: every target on the primary Bun version (a PR that changes
      #   native, lock, IPC, publication, backup, export or sync paths).
      # smoke: the Linux x64 glibc cell on the primary Bun version (other PRs).
      # scripts/ci-native-scope.sh classifies pull requests.
      # Named exception (docs/TESTING.md#event-parity): every `inputs.scope`
      # condition below (the openclaw/musl/Windows `if`s and the cross-target
      # excludes) narrows pull requests and merge-queue runs only;
      # every push to master and the nightly Test schedule run scope=full.
      scope:
        type: string
        default: full

permissions:
  contents: read

jobs:
  openclaw:
    name: OpenClaw 2026.9.4 native context-engine startup
    # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity).
    if: ${{ inputs.scope != 'smoke' }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - run: npm install --prefix "${{ runner.temp }}/openclaw-host" --ignore-scripts --omit=optional --no-audit --no-fund openclaw@2026.9.4
      - name: Exercise real plugin load and fresh conversations with a loopback-only provider
        env:
          GBRAIN_TEST_OPENCLAW_BIN: ${{ runner.temp }}/openclaw-host/node_modules/.bin/openclaw
          GBRAIN_TEST_OPENCLAW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/gbrain_test
          GBRAIN_CI_DISABLE_TEST_ENV_FILE: '1'
        run: bun test --timeout=60000 test/openclaw-context-engine-native.serial.test.ts

  native:
    name: ${{ matrix.target }} / Bun ${{ matrix.bun }}
    runs-on: ${{ fromJSON('{"linux-x64-glibc":"ubicloud-standard-4-ubuntu-2404","linux-arm64-glibc":"ubicloud-standard-4-arm-ubuntu-2404","darwin-arm64":"macos-26","darwin-x64":"macos-26-intel","win32-x64":"windows-2022","win32-arm64":"windows-11-arm"}')[matrix.target] }}
    timeout-minutes: 15
    # statuses: the darwin-x64 heartbeat below (one commit status context per cell, diag/native-heartbeat/<target>/<bun>).
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.4']
        target: [linux-x64-glibc, linux-arm64-glibc, darwin-arm64, darwin-x64, win32-x64, win32-arm64]
        # Pull requests: primary Bun on every target (native paths changed) or
        # the Linux x64 glibc smoke cell. Runners map from the target above.
        # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity).
        exclude: ${{ fromJSON(inputs.scope == 'smoke' && '[{"target":"linux-arm64-glibc"},{"target":"darwin-arm64"},{"target":"darwin-x64"},{"target":"win32-x64"},{"target":"win32-arm64"}]' || '[]') }}
    steps:
      # The data-safety step stops its suites before this job's timeout: a timeout cancel keeps no log.
      - name: Record the job deadline
        shell: bash
        run: echo "GBRAIN_JOB_DEADLINE=$(( $(date +%s) + 15 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # A wedged darwin-x64 runner uploads no log at all (#7457's cell, #7419, #7303, #7238), so a background loop posts
      # the current step or suite, free memory, swap, load and the busiest process names as the commit status
      # diag/native-heartbeat/<cell>; GitHub keeps every status, so the last one before a wedge survives it. Nothing on a
      # fork's pull request, whose token cannot write.
      - name: Start the diagnostic heartbeat
        if: matrix.target == 'darwin-x64'
        env:
          GH_TOKEN: ${{ github.token }}
          GBRAIN_HEARTBEAT_ENABLED: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && '1' || '0' }}
          GBRAIN_HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GBRAIN_HEARTBEAT_CELL: ${{ matrix.target }}/${{ matrix.bun }}
        run: bash scripts/native/heartbeat.sh start
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      # The pinned Zig archive, cached per runner OS/arch (setup-toolchain.ts re-verifies its sha256).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/gbrain-zig/zig-*.zip
            ${{ runner.temp }}/gbrain-zig/zig-*.tar.xz
          key: zig-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/toolchain.json') }}
      # Bounded inside: a 300 s download budget across every source with a
      # minimum-rate rule, 90 s to extract, 60 s for `zig version` (.223's
      # darwin-x64 cell sat here until the 15-minute job timeout).
      - name: Set up the pinned Zig compiler (bounded)
        timeout-minutes: 9
        run: bun scripts/native/setup-toolchain.ts --dir "${{ runner.temp }}/gbrain-zig" --github-path
      - run: bun scripts/native/build.ts --target ${{ matrix.target }} --output "${{ runner.temp }}/native-rebuilt"
      - run: bun scripts/native/verify.ts --rebuilt "${{ runner.temp }}/native-rebuilt"
      - name: Verify Darwin ABI against the native SDK
        if: runner.os == 'macOS'
        run: cc -std=c11 native/locks/abi-check.c -o "${{ runner.temp }}/native-abi-check"
      - run: bun test --timeout=60000 test/native-lock.test.ts test/pglite-lock.test.ts test/local-ipc-path.test.ts
      - run: bun scripts/native/compiled-smoke.ts
      - name: Verify native data-safety contracts
        shell: bash
        env:
          GBRAIN_CI_DISABLE_TEST_ENV_FILE: '1'
          GBRAIN_TEST_REQUIRE_CASE_INSENSITIVE: ${{ runner.os != 'Linux' && '1' || '0' }}
          # Per-file bound for this target: the slowest suite's p99 over 68-78 runs of each
          # target (2026-10-19), plus max(60 s, 15%), rounded up to 30 s. The slowest suite is
          # backup-portability-native everywhere: p99 94 s linux-x64, 75 s linux-arm64, 36 s
          # darwin-arm64, 105 s darwin-x64, 303 s win32-arm64, 462 s win32-x64. Each bound
          # still fires inside the 15-minute job timeout after the slowest observed setup.
          GBRAIN_NATIVE_SUITE_BOUND_S: ${{ fromJSON('{"linux-x64-glibc":"180","linux-arm64-glibc":"150","darwin-arm64":"120","darwin-x64":"180","win32-x64":"540","win32-arm64":"390"}')[matrix.target] }}
        # A file still running at its target's bound is stuck: its process table and, on macOS,
        # a native stack sample go to the log before it is killed, because a job the timeout
        # cancels keeps no log at all. Six suites at their bounds outlast the job (two darwin-x64
        # cells ran into the timeout with no log, #7303 and #7238), so every suite also stops
        # 90 s before the job deadline, and no diagnostic or kill can hold the step.
        run: |
          status=0
          bound_s="$GBRAIN_NATIVE_SUITE_BOUND_S"
          case "$bound_s" in ''|*[!0-9]*) echo "::error::GBRAIN_NATIVE_SUITE_BOUND_S is not set for this target"; exit 1 ;; esac
          case "${GBRAIN_JOB_DEADLINE:-}" in ''|*[!0-9]*) echo "::error::GBRAIN_JOB_DEADLINE is not set (the job's first step records it)"; exit 1 ;; esac
          stop_at=$((GBRAIN_JOB_DEADLINE - 90))
          within() {
            "$@" &
            local helper=$!
            for _ in $(seq 1 20); do
              if ! kill -0 "$helper" 2>/dev/null; then wait "$helper"; return; fi
              sleep 1
            done
            kill -KILL "$helper" 2>/dev/null
            echo "($1 was still running after 20 s and was stopped)"
          }
          bounded() {
            local left=$((stop_at - $(date +%s)))
            if [ "$left" -le 0 ]; then echo "::error::$1 not run: the job timeout is near"; return 1; fi
            local limit=$((left < bound_s ? left : bound_s))
            GBRAIN_HEARTBEAT_ENABLED=1 bash scripts/native/heartbeat.sh mark "$1" || true
            bun --no-env-file test --timeout=180000 "$1" &
            pid=$!
            for _ in $(seq 1 "$limit"); do
              if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; return $?; fi
              sleep 1
            done
            echo "::error::$1 was still running after $limit s, this target's bound (its slowest suite's measured p99 plus margin) or the time left before the job timeout; process table and stack sample follow, then it is killed"
            within ps -A -o pid,ppid,stat,etime,command 2>/dev/null || within ps -ef
            if command -v sample >/dev/null 2>&1; then within sample "$pid" 3 2>&1 | head -200; fi
            kill -TERM "$pid" 2>/dev/null; sleep 5; kill -KILL "$pid" 2>/dev/null
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then wait "$pid" 2>/dev/null; return 1; fi
              sleep 1
            done
            echo "::error::$1 is still running after SIGKILL: $(within ps -o pid,stat,wchan,command -p "$pid")"
            return 1
          }
          bounded test/persistence-publication-native.serial.test.ts || status=1
          bounded test/persistence-git-publication.test.ts || status=1
          bounded test/persistence-sync-origin-native.test.ts || status=1
          bounded test/backup-portability-native.serial.test.ts || status=1
          bounded test/export-publication-native.test.ts || status=1
          bounded test/native-export-publication.test.ts || status=1
          exit "$status"
      - name: Build the published CLI platforms and verify persistent writes
        if: matrix.target == 'linux-x64-glibc' || matrix.target == 'darwin-arm64'
        timeout-minutes: 8
        run: |
          bun build --compile --no-compile-autoload-bunfig --outfile bin/gbrain-native-validation src/cli.ts
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.bun }}" = "1.4.4" ]; then
            codesign --verify --strict --verbose=2 bin/gbrain-native-validation
          fi
          bun scripts/native/compiled-smoke.ts --binary bin/gbrain-native-validation
          bun scripts/native/cli-persistence-smoke.ts --binary bin/gbrain-native-validation
      # The terminal status, naming the job result: a run that ends, even cancelled, leaves nothing pending; a machine
      # that dies keeps its last heartbeat.
      - name: Stop the diagnostic heartbeat
        if: always() && matrix.target == 'darwin-x64'
        env:
          GH_TOKEN: ${{ github.token }}
          GBRAIN_HEARTBEAT_ENABLED: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && '1' || '0' }}
          GBRAIN_HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GBRAIN_HEARTBEAT_CELL: ${{ matrix.target }}/${{ matrix.bun }}
        run: bash scripts/native/heartbeat.sh stop "${{ job.status }}"

  # The darwin-x64 runner sometimes cannot reach the API when a cell ends (#7499: all three attempts of the cell's terminal
  # post timed out), so its diag/native-heartbeat/<cell> status stays pending on a job that passed. This Linux job runs
  # after every cell and posts success, naming the cell's real conclusion and last heartbeat, on any cell context still
  # pending (scripts/native/heartbeat-finalize.ts). Nothing on a fork's pull request, whose token cannot write.
  # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity); scope=smoke runs
  # no darwin-x64 cell, so there is nothing to finalize.
  heartbeat-finalize:
    name: darwin-x64 heartbeat finalize
    needs: [native]
    if: ${{ always() && inputs.scope != 'smoke' }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    # statuses: the darwin-x64 cells' diag/native-heartbeat/<cell> contexts; actions: read the run's jobs and conclusions.
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/native/heartbeat-finalize.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Finalize darwin-x64 heartbeats left pending
        env:
          GH_TOKEN: ${{ github.token }}
          GBRAIN_HEARTBEAT_ENABLED: ${{ (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && '1' || '0' }}
          GBRAIN_HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/native/heartbeat-finalize.ts

  windows-backup-console:
    name: Windows PowerShell console probe / ${{ matrix.runner }} / Bun ${{ matrix.bun }}
    # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity).
    if: ${{ inputs.scope != 'smoke' }}
    runs-on: ${{ matrix.runner }}
    # Every step carries its own bound (p99.9 over 541 windows-11-arm jobs: checkout 45 s, setup-bun 21 s,
    # install 59 s, verify 2 s, probe 43 s), so a stalled step fails by name. The job limit is those bounds plus
    # 5 minutes for runner setup, which GitHub counts against the job ("Set up job" p95 2 s, p99.9 16 s; one ARM
    # job spent 218 s there and the old 5-minute limit cancelled its passed probe).
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
        bun: ['1.4.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        timeout-minutes: 2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - run: bun scripts/native/verify.ts
        timeout-minutes: 1
      - name: Compare native hidden-window launch behavior
        timeout-minutes: 4
        shell: bash
        env:
          GBRAIN_CI_DISABLE_TEST_ENV_FILE: '1'
          GBRAIN_TEST_BACKUP_CONSOLE_PROBE: '1'
        run: |
          bun --no-env-file test --timeout=180000 --test-name-pattern '^private ACL setup compares hidden and visible PowerShell windows$' test/backup-portability-native.serial.test.ts 2>&1 | tee "$RUNNER_TEMP/backup-console.log"
          grep -Fq 'Windows backup console controls:' "$RUNNER_TEMP/backup-console.log"

  windows-backup-dotnet:
    name: Windows ACL API probe / ${{ matrix.runner }} / Bun ${{ matrix.bun }}
    # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity).
    if: ${{ inputs.scope != 'smoke' }}
    runs-on: ${{ matrix.runner }}
    # As above (probe p99.9 97 s over 267 windows-11-arm jobs; two tests at 180 s each): step bounds plus 5 minutes of setup.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
        bun: ['1.4.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        timeout-minutes: 2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - run: bun scripts/native/verify.ts
        timeout-minutes: 1
      - name: Compare cmdlet and direct dotnet ACL programs
        timeout-minutes: 7
        shell: bash
        env:
          GBRAIN_CI_DISABLE_TEST_ENV_FILE: '1'
          GBRAIN_TEST_BACKUP_DOTNET_PROBE: '1'
        run: |
          bun --no-env-file test --timeout=180000 --test-name-pattern '^private (directory|file) ACL setup compares cmdlet and direct dotnet calls$' test/backup-portability-native.serial.test.ts 2>&1 | tee "$RUNNER_TEMP/backup-dotnet.log"
          grep -Fq 'Windows backup dotnet controls: {"kind":"directory",' "$RUNNER_TEMP/backup-dotnet.log"
          grep -Fq 'Windows backup dotnet controls: {"kind":"file",' "$RUNNER_TEMP/backup-dotnet.log"

  musl:
    name: ${{ matrix.target }} / Bun ${{ matrix.bun }}
    # Named exception: PR scope reduction, covered by scope=full runs (docs/TESTING.md#event-parity).
    if: ${{ inputs.scope != 'smoke' }}
    runs-on: ${{ fromJSON('{"linux-x64-musl":"ubicloud-standard-4-ubuntu-2404","linux-arm64-musl":"ubicloud-standard-4-arm-ubuntu-2404"}')[matrix.target] }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.4']
        target: [linux-x64-musl, linux-arm64-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      # The pinned Zig archive, cached per runner OS/arch (setup-toolchain.ts re-verifies its sha256).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/gbrain-zig/zig-*.zip
            ${{ runner.temp }}/gbrain-zig/zig-*.tar.xz
          key: zig-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native/toolchain.json') }}
      # Bounded inside: a 300 s download budget across every source with a
      # minimum-rate rule, 90 s to extract, 60 s for `zig version` (.223's
      # darwin-x64 cell sat here until the 15-minute job timeout).
      - name: Set up the pinned Zig compiler (bounded)
        timeout-minutes: 9
        run: bun scripts/native/setup-toolchain.ts --dir "${{ runner.temp }}/gbrain-zig" --github-path
      - run: bun scripts/native/build.ts --target ${{ matrix.target }} --output "${{ runner.temp }}/native-rebuilt"
      - run: bun scripts/native/verify.ts --rebuilt "${{ runner.temp }}/native-rebuilt"
      - name: Execute prebuild in native musl userspace
        env:
          BUN_VERSION: ${{ matrix.bun }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "oven/bun:${BUN_VERSION}-alpine" sh -eu -c '
            bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
            bun scripts/native/verify.ts
            bun test --timeout=60000 test/native-lock.test.ts test/pglite-lock.test.ts test/local-ipc-path.test.ts
            bun --no-env-file test --timeout=180000 test/native-export-publication.test.ts
            bun --no-env-file test --timeout=180000 test/export-publication-native.test.ts
            bun scripts/native/compiled-smoke.ts
          '
