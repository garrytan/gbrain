name: Release

on:
  push:
    tags: ['v*']
  # Manual runs validate every platform without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Let both platform artifacts report their own result instead of
      # cancelling the other build when one preflight or compile step fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: gbrain-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: gbrain-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Install Admin dependencies
        working-directory: admin
        run: bun install --frozen-lockfile
      # The full suite is already enforced by the master Test workflow with
      # the optimized 10-shard layout. Re-running the generic 4-shard suite
      # here made release jobs run for 20+ minutes and get cancelled before
      # the CLI artifacts were built. Keep release preflight fast and stable.
      - name: Run release preflight checks
        run: bun run verify
      - run: bun build --compile --target=${{ matrix.target }} --outfile bin/${{ matrix.artifact }} src/cli.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            build_script: build:win
            artifact_paths: |
              desktop/dist/PMBrain-Windows-x64-Setup-*.exe
              desktop/dist/PMBrain-Windows-x64-Setup-*.exe.blockmap
              desktop/dist/latest.yml
          - platform: macos
            os: macos-latest
            build_script: build:mac
            artifact_paths: |
              desktop/dist/PMBrain-macOS-arm64-*.dmg
              desktop/dist/PMBrain-macOS-arm64-*.zip
              desktop/dist/PMBrain-macOS-arm64-*.zip.blockmap
              desktop/dist/latest-mac.yml
          - platform: linux
            os: ubuntu-latest
            build_script: build:linux
            artifact_paths: |
              desktop/dist/PMBrain-Linux-x64-*.AppImage
              desktop/dist/PMBrain-Linux-x64-*.AppImage.blockmap
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14
      # A manual run is a pre-release validation on a branch/commit, so it
      # has no release tag to compare. Tag pushes keep the strict check.
      - name: Verify desktop version matches tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e "const pkg = await Bun.file('desktop/package.json').json(); if ('v' + pkg.version !== process.env.RELEASE_TAG) throw new Error('desktop version ' + pkg.version + ' does not match tag ' + process.env.RELEASE_TAG)"
      - run: bun install --frozen-lockfile
      - name: Install Admin dependencies
        working-directory: admin
        run: bun install --frozen-lockfile
      - run: bun run build:admin
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --trust
      - name: Verify desktop runtime compatibility code
        working-directory: desktop
        run: |
          bun run typecheck
          bun test test/runtime-compatibility.test.ts test/package-version-contract.test.ts
      - name: Build and verify ${{ matrix.platform }} desktop package
        working-directory: desktop
        run: bun run ${{ matrix.build_script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pmbrain-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_paths }}

  release:
    # workflow_dispatch is intentionally a build-only dry run. Publishing is
    # reserved for an explicit v* tag push.
    if: github.event_name == 'push'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          files: |
            artifacts/gbrain-darwin-arm64/gbrain-darwin-arm64
            artifacts/gbrain-linux-x64/gbrain-linux-x64
            artifacts/pmbrain-desktop-windows/PMBrain-Windows-x64-Setup-*.exe
            artifacts/pmbrain-desktop-windows/PMBrain-Windows-x64-Setup-*.exe.blockmap
            artifacts/pmbrain-desktop-windows/latest.yml
            artifacts/pmbrain-desktop-macos/PMBrain-macOS-arm64-*.dmg
            artifacts/pmbrain-desktop-macos/PMBrain-macOS-arm64-*.zip
            artifacts/pmbrain-desktop-macos/PMBrain-macOS-arm64-*.zip.blockmap
            artifacts/pmbrain-desktop-macos/latest-mac.yml
            artifacts/pmbrain-desktop-linux/PMBrain-Linux-x64-*.AppImage
            artifacts/pmbrain-desktop-linux/PMBrain-Linux-x64-*.AppImage.blockmap
            artifacts/pmbrain-desktop-linux/latest-linux.yml
          generate_release_notes: true
