name: Release

# Publishes a GitHub release for every VERSION bump that lands on master:
# tag + title `v<VERSION>`, notes from that version's CHANGELOG.md entry,
# compiled binaries attached (#3521), plus the skill resolver library bundle
# for Node adapters (gbrain-skill-resolver.mjs, GBRA-377), plus the optional
# Rust engine addon for linux-x64-glibc and darwin-arm64 with its SHA-256
# manifest (gbrain-engine-rust.sha256.json). The addon is not inside the
# executables: `gbrain engine install rust` downloads the one this release
# names and checks it against the manifest and the attestations made here
# (src/core/rust-engine/addon-install.ts).
#
# Every release is published as a pre-release that never becomes GitHub's
# "Latest": scripts/promote-stable.ts marks the stable release Latest, with
# notes rolled up since the previous stable, so the Releases page and its
# Latest badge show the release installs follow. The alpha channel follows
# the latest-stable tag this workflow moves last; binary self-update reads
# VERSION there and downloads that exact release (src/core/binary-self-update.ts),
# never releases/latest. Bring older releases in line, or take the rule out,
# with scripts/release-channel.ts (docs/RELEASING.md).
#
# Idempotent: the `version` job skips build+release when a release for
# v<VERSION> already exists WITH all expected assets. A half-published release
# (tag exists / assets incomplete) is repaired on the next run — softprops
# updates the existing release in place. Historical 3-segment tags are never
# touched; a new 4-segment VERSION always mints a new tag.
#
# The asset names are a contract with expectedAssetName() in
# src/core/binary-self-update.ts, pinned by test/release-workflow.test.ts.
#
# CI gate (docs/RELEASING.md#release-ci-gate): the `ci-gate` job waits for
# the push-to-master runs of Test and E2E Tests on the release commit
# (scripts/release-gate.ts). Build, publication and the latest-stable move
# run only after both succeed. A failed or cancelled run publishes nothing
# and the job fails with the next step; master push runs are keyed by commit,
# so no newer push cancels them, and no later commit is published in the
# release commit's place (it may carry unreleased changes under the same
# VERSION). workflow_dispatch backfills only while master HEAD is the release
# commit (the commit that last changed VERSION); otherwise it refuses and names
# the re-run of that commit's push Release run.
#
# Releases per batch (docs/RELEASING.md#releases-per-batch): PRs land with
# changelog.d fragments and no version; a release PR moves VERSION, so this
# workflow runs once per release. Its ci-gate refuses a commit that still
# holds an unfolded fragment or a stale behavior-change table.

on:
  push:
    branches: [master]
    paths: [VERSION]
  # A dispatch with no input is the backfill of the current VERSION while master HEAD is its release commit.
  # addon_dry_run=true builds, packages and checks the Rust engine addon, and builds, smoke-tests and runs the gbrain
  # binaries as a fresh install, from the dispatched branch, and publishes nothing: ci-gate is skipped, so every publishing job (each needs ci-gate's publish == 'true', and each also
  # checks !inputs.addon_dry_run) is skipped, no attestation is made, and the run has its own concurrency group.
  workflow_dispatch:
    inputs:
      addon_dry_run:
        description: Build and check the Rust engine addon and the gbrain binaries only; publish nothing (no release, tag, asset or attestation).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A dry run never shares the release group, so it cannot queue behind or hold up a real release.
  group: ${{ inputs.addon_dry_run && 'release-addon-dry-run' || 'release' }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - id: v
        name: Read VERSION and check for an existing complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Complete = release exists AND carries every asset the self-updater
          # can request. A partial release must NOT short-circuit, so a re-run
          # can repair it.
          assets="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | sort | join(",")' 2>/dev/null || true)"
          if [ "$assets" = "gbrain-darwin-arm64,gbrain-engine-rust-darwin-arm64.node,gbrain-engine-rust-linux-x64-glibc.node,gbrain-engine-rust.sha256.json,gbrain-linux-x64,gbrain-skill-resolver.mjs,gbrain-skill-resolver.mjs.sha256" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already published with all assets — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci-gate:
    needs: version
    # Skipped on a dry run: its publish output is then empty, never 'true', and every publishing job needs 'true'.
    if: needs.version.outputs.exists == 'false' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
      test_reused_run_id: ${{ steps.gate.outputs.test_reused_run_id }}
      e2e_reused_run_id: ${{ steps.gate.outputs.e2e_reused_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .gstack
            scripts
            changelog.d
            behavior-changes.d
            src/core/behavior-change-notice.ts
            src/core/behavior-changes.generated.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      # A since: 'TBD' BEHAVIOR_CHANGES row never ships, and a release commit folds every changelog
      # fragment and dates every behavior-change row (scripts/check-behavior-since.ts --stamped).
      - name: Refuse a since 'TBD' row, an unfolded fragment or a stale behavior-change table
        run: bun scripts/check-behavior-since.ts --stamped
      - id: gate
        name: Wait for Test and E2E Tests on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bun scripts/release-gate.ts --sha "$GITHUB_SHA" --version "$RELEASE_VERSION" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"

  build:
    needs: [version, ci-gate]
    # always(): on a dry run ci-gate is skipped, and the binaries are still built and smoke-tested from the
    # dispatched branch (no attestation; the release job that publishes them stays skipped).
    if: always() && needs.version.result == 'success' && (inputs.addon_dry_run || (needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true'))
    strategy:
      matrix:
        include:
          - os: macos-26
            target: bun-darwin-arm64
            artifact: gbrain-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: gbrain-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write      # for attest-build-provenance (Sigstore OIDC)
      attestations: write  # for attest-build-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.addon_dry_run && github.sha || needs.ci-gate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'admin/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      # Supply-chain: build the admin UI FRESH from admin/src so the compiled
      # binary embeds a bundle a reviewer can trace to source — not the committed
      # admin/dist bytes. `build:admin` runs `vite build` then regenerates
      # src/admin-embedded.ts to reference the fresh (content-hashed) output, so
      # the compile below embeds this build. --frozen-lockfile so the release
      # bundle isn't built from caret-drifted admin deps (a supply-chain PR must
      # not itself be non-reproducible).
      - name: Build admin UI fresh from source
        run: |
          cd admin && bun install --frozen-lockfile --ignore-scripts && cd ..
          bun run build:admin
      # No test re-run here: the Test workflow already gated this exact SHA at
      # merge (unit shards + E2E). Re-running the whole suite serially on the
      # release runner is a flakier duplicate gate — it blocked the first
      # release on ambient-env tests (run 30698650484). The build job's gate
      # is the artifact itself: compile, then smoke-test the binary.
      - run: bun build --compile --bytecode --format=esm --no-compile-autoload-bunfig --define GBRAIN_BUILD_COMMIT='"${{ github.sha }}"' --target=${{ matrix.target }} --outfile bin/${{ matrix.artifact }} src/cli.ts src/core/skills/resolver/hook-worker.ts
      - name: Verify Darwin executable signature before execution
        if: runner.os == 'macOS'
        run: codesign --verify --strict --verbose=2 "bin/${{ matrix.artifact }}"
      - name: Verify embedded native writer locks and compiled process exclusion
        run: bun scripts/native/verify.ts && bun scripts/native/compiled-smoke.ts --binary bin/${{ matrix.artifact }}
      - name: Verify persistent writes with the actual release executable
        timeout-minutes: 8
        run: bun scripts/native/cli-persistence-smoke.ts --binary bin/${{ matrix.artifact }}
      # v0.60.554.0: /admin was blank on installed builds; the release file must serve the page and every asset it loads.
      - name: Verify the admin UI with the actual release executable
        timeout-minutes: 5
        run: bun scripts/native/compiled-admin-smoke.ts --binary bin/${{ matrix.artifact }}
      - name: Smoke-test the compiled binary
        run: |
          chmod +x bin/${{ matrix.artifact }}
          out="$(./bin/${{ matrix.artifact }} --version)"
          echo "binary reports: $out"
          v="$(tr -d '[:space:]' < VERSION)"
          case "$out" in *"$v"*) echo "version matches VERSION file" ;; *) echo "binary version '$out' does not contain '$v'" >&2; exit 1 ;; esac
      - name: Attest build provenance
        if: ${{ !inputs.addon_dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: bin/${{ matrix.artifact }}
      # Dry run only: the binary runs from an empty directory with a fresh home, as a downloaded install does.
      - name: Run the binary as an install from an empty directory (dry run)
        if: ${{ inputs.addon_dry_run }}
        run: |
          # Real path: on macOS mktemp gives /var/folders/..., and /var is a symlink gbrain refuses.
          d="$(cd "$(mktemp -d)" && pwd -P)"
          cp "bin/${{ matrix.artifact }}" "$d/gbrain"
          cd "$d"
          env -i PATH=/usr/bin:/bin HOME="$d" GBRAIN_HOME="$d" ./gbrain --version
          env -i PATH=/usr/bin:/bin HOME="$d" GBRAIN_HOME="$d" ./gbrain init --pglite --no-embedding --non-interactive --json > init.json
          env -i PATH=/usr/bin:/bin HOME="$d" GBRAIN_HOME="$d" ./gbrain doctor --json > doctor.json
          grep -q '"checks"' doctor.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

  # The optional Rust engine addon (docs/designs/RUST_ENGINE.md, decision D4), built from the gated
  # SHA on a native runner for each target a release publishes (RELEASE_ADDON_TARGETS in
  # src/core/rust-engine/addon-manifest.ts). No build cache: the published bytes come from a clean
  # build. A failed build blocks the release (decision D22). The Linux addon is built on Ubuntu 22.04,
  # so it loads on glibc 2.35 and newer.
  rust-addon:
    needs: [version, ci-gate]
    # always(): on a dry run ci-gate is skipped, and the build still runs; on a release it needs publish == 'true'.
    if: always() && needs.version.result == 'success' && (inputs.addon_dry_run || (needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true'))
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            addon_target: linux-x64-glibc
          - os: macos-26
            addon_target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      # rustup reads the pinned version from rust/rust-toolchain.toml, as in rust-engine.yml.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not installed on this runner. Use a runner image that ships rustup."
            exit 1
          fi
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/rust/rust-toolchain.toml")"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          rustc --version
      - name: Build the addon
        run: bun run rust:build
      - name: Stage the addon under its release name
        run: bun rust/scripts/release-addon.ts stage --target "${{ matrix.addon_target }}" --out rust-addon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-engine-rust-${{ matrix.addon_target }}
          path: rust-addon/
          if-no-files-found: error

  # Writes gbrain-engine-rust.sha256.json and attests it with both addons. The attestation is made
  # here because gbrain accepts only provenance whose builder is this workflow on master
  # (EXPECTED_BUILDER_IDS in src/core/binary-self-update.ts). When the previous release published
  # addons with the same engine_build (rust/ unchanged) and they pass their attestation check, their
  # bytes are published again, so installed addons and the shadow evidence that names them stay valid.
  rust-addon-package:
    needs: [version, ci-gate, rust-addon]
    if: always() && needs.rust-addon.result == 'success' && (inputs.addon_dry_run || (needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # for attest-build-provenance (Sigstore OIDC)
      attestations: write  # for attest-build-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: gbrain-engine-rust-*
          path: built
      - name: Fetch the previous release's addons, when they exist and are attested
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p previous
          prev="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "gbrain-engine-rust.sha256.json")) | .tag_name' \
            | grep -vxF "v$RELEASE_VERSION" | head -n 1 || true)"
          if [ -z "$prev" ]; then
            echo "No earlier release publishes the Rust engine addon; publishing the new build."
            exit 0
          fi
          if ! gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir previous --pattern 'gbrain-engine-rust*'; then
            echo "::warning::could not download the addons of $prev; publishing the new build"
            rm -rf previous && mkdir previous
            exit 0
          fi
          for f in previous/*; do
            # Only this workflow on master is trusted, as in EXPECTED_BUILDER_IDS: a run of release.yml from any other
            # branch also attests, so the identity and the source ref are both pinned.
            if ! gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/master \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/master" >/dev/null; then
              echo "::warning::$f of $prev has no attestation from this workflow; publishing the new build"
              rm -rf previous && mkdir previous
              exit 0
            fi
          done
          echo "Previous addons: $prev"
      - name: Write the manifest
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bun rust/scripts/release-addon.ts package --meta-dir built --version "$RELEASE_VERSION" --out rust-addon --previous previous
      - name: Attest build provenance
        if: ${{ !inputs.addon_dry_run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            rust-addon/gbrain-engine-rust-linux-x64-glibc.node
            rust-addon/gbrain-engine-rust-darwin-arm64.node
            rust-addon/gbrain-engine-rust.sha256.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-engine-rust
          path: |
            rust-addon/gbrain-engine-rust-linux-x64-glibc.node
            rust-addon/gbrain-engine-rust-darwin-arm64.node
            rust-addon/gbrain-engine-rust.sha256.json
          if-no-files-found: error

  # Dry run only: installs the packaged addon through the real installer (served as the release asset) and opens it
  # with the real loader and no GBRAIN_RUST_ENGINE_ADDON, on each target's own runner. Read-only token.
  rust-addon-dry-run-check:
    needs: [rust-addon-package]
    if: always() && inputs.addon_dry_run && needs.rust-addon-package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            addon_target: linux-x64-glibc
          - os: macos-26
            addon_target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: gbrain-engine-rust
          path: rust-addon
      - name: Install the packaged addon and load it with no override
        shell: bash
        env:
          GBRAIN_TEST_RUST_ADDON_REQUIRED: '1'
          ADDON_TARGET: ${{ matrix.addon_target }}
        run: |
          set -euo pipefail
          unset GBRAIN_RUST_ENGINE_ADDON
          want="$(jq -r --arg t "$ADDON_TARGET" '.targets[$t].sha256' rust-addon/gbrain-engine-rust.sha256.json)"
          got="$(shasum -a 256 "rust-addon/gbrain-engine-rust-$ADDON_TARGET.node" | cut -d' ' -f1)"
          test "$want" = "$got"
          mkdir -p rust/target/addon
          cp "rust-addon/gbrain-engine-rust-$ADDON_TARGET.node" "rust/target/addon/gbrain_engine.$ADDON_TARGET.node"
          bun test --timeout=60000 test/rust-engine-addon-install.test.ts

  skill-resolver-bundle:
    # GBRA-377: the skill resolver library as one dependency-free ES module for
    # Node adapters (docs/guides/skill-resolver.md#library). Built from the gated
    # SHA and smoke-tested under Node before it is attached with its sha256.
    needs: [version, ci-gate]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile --ignore-scripts
      - name: Build and smoke-test the bundle under Node
        run: bun scripts/build-skill-resolver-bundle.ts --out bundle/gbrain-skill-resolver.mjs --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-skill-resolver.mjs
          path: |
            bundle/gbrain-skill-resolver.mjs
            bundle/gbrain-skill-resolver.mjs.sha256

  release:
    needs: [version, ci-gate, build, skill-resolver-bundle, rust-addon-package]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the tag + release (scoped to this job only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          # Full history and tags: the notes list reads the fragments every
          # release commit since the previous v* tag folded.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Check the skill resolver bundle against its sha256
        working-directory: artifacts/gbrain-skill-resolver.mjs
        run: sha256sum -c gbrain-skill-resolver.mjs.sha256
      - name: Extract CHANGELOG entry for release notes
        # env-bound, not inlined into the script: VERSION comes from master so
        # it isn't attacker-reachable today, but a `${{ }}` inside `run:` is
        # shell injection by construction if that ever changes.
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          v="$RELEASE_VERSION"
          if ! bash scripts/changelog-entry.sh --pr-list "$v" > /tmp/release-notes.md || ! [ -s /tmp/release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for v$v." > /tmp/release-notes.md
          fi
      # A re-run that repairs a half-published release republishes it as a
      # pre-release. If that release is already the stable one, the re-run
      # would take away the stable flag and GitHub's Latest; refuse instead.
      - name: Refuse to republish the current stable release
        env:
          RELEASE_SHA: ${{ needs.ci-gate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          stable="$(git ls-remote origin 'refs/tags/stable^{}' | cut -f1)"
          if [ -n "$stable" ] && [ "$stable" = "$RELEASE_SHA" ]; then
            echo "::error::v$RELEASE_VERSION is the current stable release; re-publishing it would mark it a pre-release. Upload the missing assets with gh release upload v$RELEASE_VERSION <files> instead (docs/RELEASING.md)."
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.ci-gate.outputs.sha }}
          body_path: /tmp/release-notes.md
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            artifacts/gbrain-darwin-arm64/gbrain-darwin-arm64
            artifacts/gbrain-linux-x64/gbrain-linux-x64
            artifacts/gbrain-engine-rust/gbrain-engine-rust-linux-x64-glibc.node
            artifacts/gbrain-engine-rust/gbrain-engine-rust-darwin-arm64.node
            artifacts/gbrain-engine-rust/gbrain-engine-rust.sha256.json
            artifacts/gbrain-skill-resolver.mjs/gbrain-skill-resolver.mjs
            artifacts/gbrain-skill-resolver.mjs/gbrain-skill-resolver.mjs.sha256
      # [C1 = D6-A] `latest-stable` is the alpha channel's ref: the alpha
      # update check follows it, and so does anyone who pins it by hand. The
      # install surfaces (the README paste block, the BOOTSTRAP_FOR_AGENTS.md
      # fetch URL, `bun install -g github:garrytan/gbrain#stable`) name the
      # `stable` tag instead (src/core/install-ref.ts), which only
      # promote-stable.yml moves. Both refs move only to a release whose assets
      # already published, so neither has a 404 window. latest-stable is
      # a maintainer-controlled tag advanced ONLY here — the FINAL step of the
      # release job, after binaries + provenance attestation have fully
      # published — so a half-built release never moves it. The force-move
      # (`+`) is intentional: latest-stable tracks the newest verified release;
      # per-release history lives in the immutable v<VERSION> tags.
      # scripts/check-bootstrap-tag.sh keeps the entry docs pinned to INSTALL_REF.
      #
      # If this step ALONE fails, re-advance by hand (a full re-run would skip:
      # the release already exists with all assets):
      #   git push origin "+refs/tags/v<VERSION>^{commit}:refs/tags/latest-stable"
      - name: Advance latest-stable to this release commit
        env:
          RELEASE_SHA: ${{ needs.ci-gate.outputs.sha }}
        run: git push origin "+${RELEASE_SHA}:refs/tags/latest-stable"

  # After publication: the executable users download installs the published Rust engine addon the
  # way a user does (`gbrain engine install rust`: download, SHA-256 and attestation checks), then
  # opens a new Rust brain with it and no GBRAIN_RUST_ENGINE_ADDON. It runs after the release is up,
  # so a broken addon turns this run red but does not unpublish the release; stable promotion is
  # gated separately (promote-stable.yml). The install reads attestations from the unauthenticated
  # GitHub API, so it retries a rate-limited read.
  rust-addon-smoke:
    needs: [version, ci-gate, release]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: gbrain-linux-x64
          - os: macos-26
            executable: gbrain-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install the published addon with the published executable and open a Rust brain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rust-addon-smoke"
          mkdir -p "$work"
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern "$EXECUTABLE"
          gbrain="$work/$EXECUTABLE"
          chmod +x "$gbrain"
          unset GBRAIN_RUST_ENGINE_ADDON
          export GBRAIN_HOME="$work/home"
          mkdir -p "$GBRAIN_HOME/.gbrain"
          ok=0
          for _ in 1 2 3; do
            if "$gbrain" engine install rust --json > "$work/install.json"; then ok=1; break; fi
            cat "$work/install.json"
            sleep 60
          done
          cat "$work/install.json"
          test "$ok" = 1
          printf '{"engine":"rust","database_path":"%s"}\n' "$GBRAIN_HOME/.gbrain/brain.rust" > "$GBRAIN_HOME/.gbrain/config.json"
          # The first command opens, and so creates, the Rust brain with the installed addon.
          "$gbrain" stats --json
          "$gbrain" engine status --json --probe > "$work/status.json"
          cat "$work/status.json"
          jq -e '.rust_addon.installed == true and .rust_addon.override == false and .probe.ok == true' "$work/status.json"
          echo "the published addon installed and opened a Rust brain"

  # The production soak on the new tag's exact tree. Its search speed gate decides
  # whether this release may reach stable (docs/RELEASING.md#search-speed-gate).
  # A workflow_dispatch from GITHUB_TOKEN starts a run, unlike its tag push.
  soak:
    needs: [version, ci-gate, release]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # dispatch production-soak.yml (scoped to this job only)
    steps:
      - name: Dispatch the production soak on v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run production-soak.yml -R "$GITHUB_REPOSITORY" --ref "v$RELEASE_VERSION"

  # [G7/S3#4] Publishes the rendered agent-workspace template repo (the
  # GitHub "Use this template" door) from CI ONLY — no human pushes it by
  # hand, so what adopters clone is exactly what this repo reviewed. Guarded
  # three ways:
  #   1. The release above fully published (needs: release + the exists gate).
  #   2. The vendored tree templates/bootstrap/template-repo/ exists — the
  #      generator/doors work may not have landed yet; skip, never fail.
  #   3. The TEMPLATE_REPO_PAT secret is configured. Secrets are not readable
  #      in job-level `if:` expressions, so the secret is bound to env (the
  #      same env-indirection pattern as the release-notes step) and checked
  #      by the gate step's shell.
  #
  # TEMPLATE_REPO_PAT scope: a fine-grained PAT with `contents: write` on the
  # template repository ONLY — no other repositories, no other permissions.
  # Documented in docs/RELEASING.md.
  publish-template:
    needs: [version, ci-gate, release]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEMPLATE_REPO_PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
      # owner/name of the template repo; override via repository variable.
      TEMPLATE_REPO: ${{ vars.TEMPLATE_REPO || 'garrytan/gbrain-agent-template' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - id: gate
        name: Gate on PAT + vendored template tree
        run: |
          # A skip here is visible (warning + step summary), never a silent
          # green: this release did not publish the agent template (D-10).
          if [ -z "$TEMPLATE_REPO_PAT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Agent template NOT published to $TEMPLATE_REPO — the TEMPLATE_REPO_PAT secret is empty. Why: only the repo owner can set secrets. Fix (owner-only): gh secret set TEMPLATE_REPO_PAT (fine-grained PAT with contents: write on $TEMPLATE_REPO), then re-run this release workflow."
            {
              echo "## Agent template not published"
              echo "The TEMPLATE_REPO_PAT secret is empty, so \`$TEMPLATE_REPO\` did not get this release's \`templates/bootstrap/template-repo/\` tree."
              echo ""
              echo "- Why: only the repo owner can set secrets."
              echo "- Fix (owner-only): \`gh secret set TEMPLATE_REPO_PAT\` (fine-grained PAT, contents: write on \`$TEMPLATE_REPO\`), then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -d templates/bootstrap/template-repo ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Agent template NOT published — templates/bootstrap/template-repo/ is missing from this checkout. Fix: restore the vendored tree, then re-run this release workflow."
            echo "## Agent template not published: templates/bootstrap/template-repo/ is missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - if: steps.gate.outputs.publish == 'true'
        name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - if: steps.gate.outputs.publish == 'true'
        name: Generate template tree and byte-diff against the vendored copy
        run: |
          bun run scripts/generate-template-repo.ts --out /tmp/template-tree
          # [A1] Publish gate: fresh generator output must equal the vendored
          # tree byte-for-byte. A mismatch means the vendored tree is stale —
          # regenerate + commit it (scripts/check-bootstrap-templates.sh runs
          # this same diff offline in `bun run verify`).
          diff -r /tmp/template-tree templates/bootstrap/template-repo
      - if: steps.gate.outputs.publish == 'true'
        name: Force-push the template repo
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.ci-gate.outputs.sha }}
        run: |
          set -euo pipefail
          # [C3] The vendored template tree's git hash at the gated release
          # commit (the commit this job checked out and the release was
          # published at, which differs from github.sha when a cancelled push
          # was followed to a newer commit). Embedded in the template repo's
          # commit message so template-repo HEAD audits back to the exact
          # reviewed tree in THIS repo. Empty until the tree is vendored.
          TEMPLATE_TREE_HASH="$(git rev-parse "${RELEASE_SHA}:templates/bootstrap/template-repo" 2>/dev/null || true)"
          cd /tmp/template-tree
          git init -q -b main
          git config user.name "gbrain-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # History-less by design: each release force-publishes one commit
          # whose message binds (gbrain version, vendored tree hash) [C3].
          git commit -q -m "gbrain v${RELEASE_VERSION} template (tree ${TEMPLATE_TREE_HASH:-unvendored})"
          # Out-of-band credential: a one-shot GIT_ASKPASS script reads the
          # PAT from env at prompt time, so the token never rides argv (where
          # `ps`, runner traces, and error messages echoing the remote URL
          # could surface it).
          ASKPASS="$(mktemp)"
          # shellcheck disable=SC2016  # $1/$TEMPLATE_REPO_PAT are literal on
          # purpose — they must expand when /bin/sh runs the askpass script at
          # git's credential prompt, not when this outer shell writes the file.
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in Username*) printf "x-access-token\n" ;; *) printf "%s\n" "$TEMPLATE_REPO_PAT" ;; esac' \
            > "$ASKPASS"
          chmod +x "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git push --force "https://github.com/${TEMPLATE_REPO}.git" HEAD:main
          rm -f "$ASKPASS"

  # ── Slim plugin distribution (EV4): the codex-plugin orphan branch ─────────
  # `codex plugin marketplace add garrytan/gbrain@codex-plugin` should download
  # the PLUGIN, not the 90+MiB dev repo. Each release force-publishes a
  # single history-less commit to the `codex-plugin` branch carrying exactly
  # the plugin artifacts: the manifests (.agents/, .codex-plugin/,
  # .claude-plugin/), the shared launcher, and the curated plugin/ tree. All
  # plugin paths are repo-root-relative, so the slim branch is self-consistent
  # by construction. The repo-root source form keeps working for from-source
  # installs. Same trust model as the force-advanced latest-stable tag.
  publish-codex-plugin:
    needs: [version, ci-gate, release]
    if: needs.version.outputs.exists == 'false' && needs.ci-gate.outputs.publish == 'true' && !inputs.addon_dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write  # force-push the codex-plugin branch of THIS repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          # This job holds contents:write; bun install + the generator run
          # before the push, so the checkout token must not persist into
          # .git/config — the push step supplies GH_TOKEN explicitly.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (bounded, retried once)
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - name: Drift gate — committed plugin tree matches the generator
        run: bash scripts/check-plugin-tree.sh
      - name: Assemble the plugin dist tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/plugin-dist
          cp -R .agents .codex-plugin .claude-plugin plugin plugin-variants /tmp/plugin-dist/
          # Both plugin manifests declare "license": "MIT"; the slim branch is
          # exactly the artifact whose consumers never see the repo root, so
          # it must carry the license text.
          cp LICENSE /tmp/plugin-dist/ 2>/dev/null || cp LICENSE.md /tmp/plugin-dist/LICENSE
          test -f /tmp/plugin-dist/LICENSE
          # Keep the launcher's exec bit explicit (cp -R preserves it, but the
          # branch contract is load-bearing — assert it). Persona variants are
          # self-contained plugin roots, so each carries its own launcher.
          test -x /tmp/plugin-dist/.agents/gbrain-launcher
          for v in /tmp/plugin-dist/plugin-variants/*/; do
            test -x "$v/.agents/gbrain-launcher"
          done
      - name: Force-push the codex-plugin branch
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/plugin-dist
          git init -q -b codex-plugin
          git config user.name "gbrain-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "gbrain v${RELEASE_VERSION} codex/claude plugin dist (history-less; source: the release commit)"
          # Out-of-band credential (mirrors the publish-template job): the PAT
          # rides GIT_ASKPASS at prompt time, never the push URL / argv (where
          # a same-user process could read it from the process table).
          ASKPASS="$RUNNER_TEMP/git-askpass-plugin.sh"
          # shellcheck disable=SC2016  # $GH_TOKEN is literal on purpose — it
          # must expand when /bin/sh runs the askpass script at prompt time,
          # not now (same pattern as the publish-template job above).
          printf '#!/bin/sh\nexec echo "$GH_TOKEN"\n' > "$ASKPASS"
          chmod +x "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git -c credential.username=x-access-token \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" codex-plugin
          rm -f "$ASKPASS"
