name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsonb-parity:
    name: Postgres JSONB parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run JSONB parity files through the E2E wrapper
        run: bash scripts/run-e2e.sh test/e2e/postgres-jsonb.test.ts test/e2e/jsonb-roundtrip.test.ts test/phantom-redirect-engine-parity.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test

  tier1:
    name: Tier 1 (Mechanical)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run Tier 1 E2E files sequentially
        run: bash scripts/run-e2e.sh test/e2e/mechanical.test.ts test/e2e/mcp.test.ts test/e2e/advisor-mcp-postgres.test.ts test/e2e/quick-maintenance-postgres.test.ts test/e2e/read-enrichment-alignment.test.ts test/e2e/cycle-consolidate-postgres.test.ts test/e2e/session-import-postgres.test.ts test/e2e/facts-idea-postgres.test.ts test/e2e/writeback-ttl-postgres.test.ts test/e2e/writeback-transports.test.ts test/e2e/model-compatibility-ingest.test.ts test/e2e/model-compatibility-capture.test.ts test/e2e/model-compatibility-extraction.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test

  tier2:
    name: Tier 2 (LLM Skills)
    needs: jsonb-parity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Install OpenClaw with bounded retries
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npm install -g openclaw@2026.4.9; then
              exit 0
            fi
            echo "OpenClaw install attempt $attempt failed; retrying" >&2
            sleep 10
          done
          exit 1
      - name: Configure OpenClaw MCP
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/config.json <<EOF
          {
            "mcpServers": {
              "gbrain": {
                "command": "bun",
                "args": ["run", "src/cli.ts", "serve"],
                "env": {
                  "DATABASE_URL": "$DATABASE_URL"
                }
              }
            }
          }
          EOF
      # OpenClaw resolves its client configuration from the runner HOME, so
      # this is the one explicit direct-Bun exception to the wrapper. The
      # database name is still test-shaped and the preload allow is scoped to
      # this job only; no workflow/global allow variable is set.
      - name: Run Tier 2 skill tests
        run: |
          for file in test/e2e/skills.test.ts test/e2e/zeroentropy-live.test.ts; do
            echo "=== $file ==="
            timeout 720 bun test --timeout=60000 "$file"
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZEROENTROPY_API_KEY: ${{ secrets.ZEROENTROPY_API_KEY }}


  e2e-status:
    needs: [jsonb-parity, tier1, tier2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        run: |
          for result in "${{ needs.jsonb-parity.result }}" "${{ needs.tier1.result }}" "${{ needs.tier2.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required execution did not succeed: $result" >&2
              exit 1
            fi
          done
          echo "All required executions succeeded."
