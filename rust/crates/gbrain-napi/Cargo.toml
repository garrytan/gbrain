[package]
name = "gbrain-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Node-API binding for the gbrain Rust engine; the only crate that knows JavaScript."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exposes the test-only seed methods of gbrain-store (parity Rust arm). Not a default feature; the shipped addon is built without it.
test-seeds = ["gbrain-store/test-seeds"]

[dependencies]
napi = { version = "3", features = ["napi8", "serde-json"] }
gbrain-store = { path = "../gbrain-store" }
serde = "1"
serde_json = "1"
napi-derive = "3"

[build-dependencies]
napi-build = "2"
sha2 = "0.10"
