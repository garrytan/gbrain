[package]
name = "gbrain-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Node-API binding for the gbrain Rust engine; the only crate that knows JavaScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi8", "serde-json"] }
gbrain-store = { path = "../gbrain-store" }
serde = "1"
serde_json = "1"
napi-derive = "3"

[dev-dependencies]
# Property tests of the binding's argument decoding only (never linked into the addon).
proptest = { version = "1", default-features = false, features = ["std"] }
# The engineBuild digest tests include build_digest.rs, which hashes with sha2.
sha2 = "0.10"

[build-dependencies]
napi-build = "2"
sha2 = "0.10"
