[package]
name = "gbrain-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Record store for the gbrain Rust engine: redb behind a narrow key-value trait, pages, chunks, keyword search and the write journal. No JavaScript types."

[dependencies]
redb = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"
sha2 = "0.10"
# The storage bake-off only (`fjall_kv`); off by default, so the addon does not link it.
fjall = { version = "3.1", optional = true }

[features]
fjall = ["dep:fjall"]
# The crash cell's test-only record file backend (`src/crash_points.rs`, scripts/rust-crash/README.md). Off by default:
# the release addon is built without it, so it cannot see the crash cell's environment variables.
crash-points = []

[dev-dependencies]
gbrain-sim = { path = "../gbrain-sim" }

# The bench tool's unit tests (the query generator) run with `cargo test`.
[[example]]
name = "keyword_scale"
test = true
