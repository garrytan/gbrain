\* #8705 with its fixes (03b89121): writes held for an import, a later write to the page held beside a held one, the
\* import expiry re-checking under the source row lock, deferral behind recovery_required. Mutants hold-beside-held-off and
\* import-expiry-skips-source-lock put back the two races this model found before the fixes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 2
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 1
  MaxLocalEdits = 0
  ImportHolds = TRUE
  HoldBehindHeld = TRUE
  ImportExpiryLocksSource = TRUE
  RecoveryDefers = TRUE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
  MaxCrashes = 1
  MayReset = FALSE
  OutsideHelp = TRUE
INVARIANT TypeOK
INVARIANT NoDeadlock
INVARIANT AppliedAtMostOnce
INVARIANT ReceiptMatchesApply
INVARIANT EveryEndNamed
INVARIANT ImportedRevisionNeverHidden
INVARIANT FenceNeverMidPrepare
INVARIANT DeferredWaitsForRelease
INVARIANT RefreshChangeNeverOverwritten
INVARIANT NoDeferToReleased
INVARIANT ReleasedWhenEnded
INVARIANT RecoveryOnlyByPolicy
INVARIANT ExpiryOnlyWhileWaiting
INVARIANT RestoreLeavesNoOpenWrite
INVARIANT NoApplyAfterRevoke
INVARIANT CommitsInAdmissionOrder
