\* Liveness under fairness, one write: every deferred write leaves deferral and every admitted write ends.
\* RefreshBarrierLivenessNightly.cfg checks two writes.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 1
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 0
  MaxLocalEdits = 0
  ImportHolds = FALSE
  HoldBehindHeld = FALSE
  ImportExpiryLocksSource = FALSE
  RecoveryDefers = FALSE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
  MaxCrashes = 1
  MayReset = FALSE
  OutsideHelp = TRUE
PROPERTY DeferredLeaves
PROPERTY EveryWriteEnds
