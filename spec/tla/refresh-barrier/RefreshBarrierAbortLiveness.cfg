\* GST-1853: liveness with no outside help. Time never forces the wait limit and no scheduled sync runs; another agent
\* commits F while a refresh drains (the commit its fence keeps sync from importing), so the refresh aborts and a write
\* deferred behind it is held for that import. Every deferred write still leaves deferral and every write ends, through the
\* sync a refresh run owes after an aborted refresh (mutant abort-skips-owed-sync removes it).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 1
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 1
  MaxLocalEdits = 0
  ImportHolds = TRUE
  HoldBehindHeld = TRUE
  ImportExpiryLocksSource = TRUE
  RecoveryDefers = TRUE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
  MaxCrashes = 1
  MayReset = FALSE
  OutsideHelp = FALSE
PROPERTY DeferredLeaves
PROPERTY EveryWriteEnds
