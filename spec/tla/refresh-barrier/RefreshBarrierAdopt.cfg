\* #8708 as coded on #8705: one uncommitted local edit adopted by a drift refusal, no foreign commit. The two #8705
\* open findings' invariants are left to RefreshBarrierImport*.cfg. RefreshBarrierAdoptNightly.cfg adds a foreign commit.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 2
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 0
  MaxLocalEdits = 1
  ImportHolds = TRUE
  HeldImportBlocks = FALSE
  ImportExpiryLocksSource = FALSE
  RecoveryDefers = TRUE
  AdoptLocalEdits = TRUE
  MayRestore = FALSE
  MayRevoke = FALSE
INVARIANT TypeOK
INVARIANT NoDeadlock
INVARIANT AppliedAtMostOnce
INVARIANT ReceiptMatchesApply
INVARIANT EveryEndNamed
INVARIANT ImportedRevisionNeverHidden
INVARIANT FenceNeverMidPrepare
INVARIANT DeferredWaitsForRelease
INVARIANT RefreshChangeNeverOverwritten
INVARIANT NoDeferToReleased
INVARIANT ReleasedWhenEnded
INVARIANT RestoreLeavesNoOpenWrite
INVARIANT NoApplyAfterRevoke
