\* #8705 as coded. Open finding: the import expiry re-checks last_commit without a lock on the source row, so a sync
\* stamp that commits between the re-check and completeWrite leaves a write failed pending_import_expired after its import
\* landed. Flip ImportExpiryLocksSource to TRUE once the re-check declares the protocol and locks the source row FOR SHARE.
\* CommitsInAdmissionOrder is RefreshBarrierImportOrder.cfg's finding.
\* OPEN_FINDING: ExpiryOnlyWhileWaiting
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 2
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 1
  MaxLocalEdits = 0
  ImportHolds = TRUE
  HeldImportBlocks = FALSE
  ImportExpiryLocksSource = FALSE
  RecoveryDefers = TRUE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
INVARIANT TypeOK
INVARIANT NoDeadlock
INVARIANT AppliedAtMostOnce
INVARIANT ReceiptMatchesApply
INVARIANT EveryEndNamed
INVARIANT ImportedRevisionNeverHidden
INVARIANT FenceNeverMidPrepare
INVARIANT DeferredWaitsForRelease
INVARIANT RefreshChangeNeverOverwritten
INVARIANT NoDeferToReleased
INVARIANT ReleasedWhenEnded
INVARIANT ExpiryOnlyWhileWaiting
INVARIANT RestoreLeavesNoOpenWrite
INVARIANT NoApplyAfterRevoke
