\* #8682: the barrier, its expiry and restore; two writes (one blind), one refresh, one foreign commit, and the refreshing
\* process killed once at any step and recovered by recoverOne (with the fix for the fenced-orphan finding modelled).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 2
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 1
  MaxLocalEdits = 0
  ImportHolds = FALSE
  HoldBehindHeld = FALSE
  ImportExpiryLocksSource = FALSE
  RecoveryDefers = FALSE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
  MaxCrashes = 1
  MayReset = TRUE
  OutsideHelp = TRUE
INVARIANT TypeOK
INVARIANT NoDeadlock
INVARIANT AppliedAtMostOnce
INVARIANT ReceiptMatchesApply
INVARIANT EveryEndNamed
INVARIANT ImportedRevisionNeverHidden
INVARIANT FenceNeverMidPrepare
INVARIANT DeferredWaitsForRelease
INVARIANT RefreshChangeNeverOverwritten
INVARIANT NoDeferToReleased
INVARIANT ReleasedWhenEnded
INVARIANT RecoveryOnlyByPolicy
INVARIANT ExpiryOnlyWhileWaiting
INVARIANT RestoreLeavesNoOpenWrite
INVARIANT NoApplyAfterRevoke
INVARIANT CommitsInAdmissionOrder
