\* #8705 as coded (writes held for an import, deferral behind recovery_required). Open finding: a write held for an
\* import holds back no later write, so a later write to the same page commits between the sync's page import and its
\* last_commit stamp, and the held write then lands on top of it. Flip HeldImportBlocks to TRUE once the claim's FIFO
\* rule counts held rows. ExpiryOnlyWhileWaiting is RefreshBarrierImportExpiry.cfg's finding.
\* OPEN_FINDING: CommitsInAdmissionOrder
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NW = 2
  Blind = {1}
  MaxRefreshes = 1
  MaxForeign = 1
  MaxLocalEdits = 0
  ImportHolds = TRUE
  HeldImportBlocks = FALSE
  ImportExpiryLocksSource = FALSE
  RecoveryDefers = TRUE
  AdoptLocalEdits = FALSE
  MayRestore = FALSE
  MayRevoke = FALSE
INVARIANT TypeOK
INVARIANT NoDeadlock
INVARIANT AppliedAtMostOnce
INVARIANT ReceiptMatchesApply
INVARIANT EveryEndNamed
INVARIANT ImportedRevisionNeverHidden
INVARIANT FenceNeverMidPrepare
INVARIANT DeferredWaitsForRelease
INVARIANT RefreshChangeNeverOverwritten
INVARIANT NoDeferToReleased
INVARIANT ReleasedWhenEnded
INVARIANT RestoreLeavesNoOpenWrite
INVARIANT NoApplyAfterRevoke
INVARIANT CommitsInAdmissionOrder
