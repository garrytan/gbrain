\* Nightly only (tlc.sh runs it with TLC_NIGHTLY=1; about 2 minutes on 4 CPUs): DrainLeaseSafety.cfg with two
\* overlapping fenced transactions per holder (sync lanes), at a shorter clock bound and one cursor step.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Procs = {p1, p2}
  Lanes = 2
  TickMs = 20000
  TtlMs = 120000
  RefreshMs = 20000
  RenewTimeoutMs = 30000
  StealGraceMs = 60000
  TakeoverGraceMs = 60000
  MaxTxMs = 60000
  CancelMs = 120000
  RenewalWinsGap = FALSE
  UnsafeSteals = TRUE
  Stamps = FALSE
  MaxTime = 8
  MaxTokens = 3
  MaxCursor = 1
  MaxSleeps = 1
  MaxCrashes = 1
SYMMETRY Symm
INVARIANT TypeOK
INVARIANT FencedTxnsMatchRow
INVARIANT OneDrainer
PROPERTY CursorMonotone
